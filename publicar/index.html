<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me gustas</title>

    <!-- Letras cursivas y tiernas. Necesitan internet; si no cargan, el navegador usa una cursiva suya -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Dancing+Script:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --letra-carta: 'Caveat', 'Segoe Print', 'Bradley Hand', 'Dancing Script', cursive;
        }
        body { margin: 0; overflow: hidden; touch-action: none; }
        canvas { display: block; }

        /* capas (z-index):  canvas = 0  <  pareja = 2  <  snoopy.gif = 3  <  tarjetas = 10  <  botón = 11 */
        #snoopy {
            position: fixed;
            bottom: 16%;      /* queda encima de la barra negra de abajo */
            left: 50%;
            transform: translateX(-50%);
            width: min(clamp(110px, 19vh, 160px), 45vw);   /* se adapta a pantallas bajitas y a celulares */
            opacity: 0;
            transition: opacity 1s;
            pointer-events: none;
            z-index: 3;
        }

        /* La imagen de la pareja, al pie del árbol. El JS le pone el ancho y la posición */
        #pareja {
            position: fixed;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 1.4s;
            pointer-events: none;   /* los clics la atraviesan y llegan al canvas */
            z-index: 2;
        }

        /* ---------- Tarjetas en forma de corazón (globos) ---------- */
        /* El JS les pone el ancho (--cw), la posición y el giro en cada cuadro */
        .carta {
            position: fixed;
            left: 0;
            top: 0;
            width: var(--cw, 300px);
            height: calc(var(--cw, 300px) * 1.1);
            transform-origin: 50% 44.5%;    /* el giro es alrededor del centro del corazón */
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            will-change: transform, opacity;
        }
        .carta svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 10px 12px rgba(190, 70, 110, 0.28));   /* sombra suave */
        }
        .carta-texto {
            position: absolute;
            left: 21%;
            top: 22.7%;
            width: 58%;
            height: 34%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            font-family: var(--letra-carta);
            font-weight: 700;
            line-height: 1.1;
            color: #7a2a47;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
        }
        .carta-texto span { display: block; max-width: 100%; }

        /* ---------- Botón para pasar a la siguiente tarjeta ---------- */
        .btn-sig {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 11;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 10px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            font-family: var(--letra-carta);
            font-weight: 700;
            font-size: 22px;
            color: #8a2f4f;
            padding: 8px 24px 9px;
            border-radius: 999px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            background: linear-gradient(180deg, #ffe3ec, #ffbfd2);
            box-shadow: 0 6px 16px rgba(200, 70, 110, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-sig.visible { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
        .btn-sig.visible:hover { filter: brightness(1.04); }
        .btn-sig.visible:active { transform: translate(-50%, 0) scale(0.96); }
    
        :root {
            --letra-b: 'Dancing Script', 'Segoe Script', 'Snell Roundhand', 'Brush Script MT', cursive;
        }

        /* La invitación: la pregunta y el botón van encima del corazón grande (que se dibuja en el canvas) */
        #invitacion {
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }
        #invitacion.visible { opacity: 1; }

        #pregunta {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            font-family: var(--letra-b);
            font-weight: 700;
            line-height: 1.05;
            text-shadow: 0 2px 8px rgba(140, 20, 60, 0.35);
        }
        #pregunta span { display: block; max-width: 100%; }

        #btnOk {
            position: absolute;
            transform: translate(-50%, -50%);
            font-family: var(--letra-b);
            font-weight: 700;
            color: #e8416f;
            padding: 0.2em 1.2em 0.28em;
            border-radius: 999px;
            border: 2px solid rgba(255, 255, 255, 0.95);
            background: linear-gradient(180deg, #fffdf8, #ffe3ec);
            box-shadow: 0 6px 16px rgba(150, 20, 60, 0.35), inset 0 1px 0 #fff;
            cursor: pointer;
            pointer-events: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s ease;
        }
        #invitacion.visible #btnOk { pointer-events: auto; }
        #btnOk:focus { outline: none; }
        #btnOk:focus-visible { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9), 0 6px 16px rgba(150, 20, 60, 0.35); }
        #btnOk:hover { transform: translate(-50%, -50%) scale(1.05); }
        #btnOk:active { transform: translate(-50%, -50%) scale(0.96); }

        /* La cortina rosa con la que se pasa a la animación */
        #cortina {
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            background: #ff5c86;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 200;
        }
    
        #bienvenida { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; background: #cfeaff; touch-action: none; }
        #bienvenida canvas { width: 100%; height: 100%; }

        /* Cuando terminan las tarjetas, Snoopy y Fifi laten y se pueden tocar */
        #pareja.activa { pointer-events: auto; cursor: pointer; filter: drop-shadow(0 0 12px rgba(255, 90, 140, 0.7)); animation: latePareja 1.8s ease-in-out infinite; }
        @keyframes latePareja {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50%      { transform: translateX(-50%) scale(1.04); }
        }
        #pistaFinal {
            position: fixed;
            transform: translate(-50%, -100%);
            font-family: var(--letra-carta);
            font-weight: 700;
            font-size: clamp(20px, 3.2vh, 28px);
            color: #fff;
            background: rgba(232, 65, 111, 0.92);
            padding: 0.1em 0.8em 0.18em;
            border-radius: 999px;
            box-shadow: 0 4px 12px rgba(150, 20, 60, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s;
            z-index: 4;
        }
        #pistaFinal.visible { opacity: 1; animation: flota 1.8s ease-in-out infinite; }
        @keyframes flota { 0%, 100% { transform: translate(-50%, -100%); } 50% { transform: translate(-50%, calc(-100% - 8px)); } }

        /* FINAL: imagen en el cielo + mensaje que se desplaza */
        #final { position: absolute; top: 0; right: 0; bottom: 0; left: 0; opacity: 0; pointer-events: none; transition: opacity 1.2s ease; }
        #final.visible { opacity: 1; pointer-events: auto; }
        #besoImg {
            position: absolute; left: 50%; top: 3.5vh;
            transform: translateX(-50%);
            max-height: 38vh; max-width: min(78vw, 520px); width: auto; height: auto;
            filter: drop-shadow(0 8px 14px rgba(120, 60, 90, 0.25));
            animation: flotaBeso 4.5s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes flotaBeso { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-10px); } }
        #panelMsg {
            position: absolute; left: 50%; bottom: 3.5vh; transform: translateX(-50%);
            width: min(92vw, 760px); height: 43vh;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.93);       /* sin desenfoque de fondo: era costoso con el cielo en movimiento */
            box-shadow: 0 10px 30px rgba(190, 50, 100, 0.25), inset 0 0 0 2px rgba(255, 255, 255, 0.9);
            overflow: hidden;
        }
        #mensajeFinal {
            height: 100%; overflow-y: auto; box-sizing: border-box;
            padding: 8% 7%;
            scrollbar-width: none;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%);
            font-family: var(--letra-b);
            font-weight: 600;
            font-size: clamp(19px, 3.1vh, 27px);
            line-height: 1.3;
            color: #a8325e;
            text-align: center;
        }
        #mensajeFinal::-webkit-scrollbar { display: none; }
        #mensajeFinal p { margin: 0 0 1em; }
        #mensajeFinal p.firma { font-size: 1.15em; color: #e8416f; margin-bottom: 2.2em; }

        /* Botón de corazón "Empezar de nuevo", al final del mensaje */
        #btnReiniciar {
            display: block; position: relative;
            width: clamp(115px, 19vh, 150px); aspect-ratio: 200 / 180;
            margin: 0.4em auto 1.6em; padding: 0; border: 0; background: none;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            filter: drop-shadow(0 6px 10px rgba(190, 40, 90, 0.4));
            animation: lateBoton 1.6s ease-in-out infinite;
        }
        #btnReiniciar svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #btnReiniciar span {
            position: absolute; top: 18%; left: 20%; right: 20%; bottom: 22%;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--letra-b); font-weight: 700; color: #fff;
            font-size: clamp(17px, 2.9vh, 24px); line-height: 1.05;
            text-shadow: 0 1px 4px rgba(140, 20, 60, 0.45);
        }
        #btnReiniciar:active { transform: scale(0.94); }
        @keyframes lateBoton { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

        /* ============ PUERTA CON CONTRASEÑA ============ */
        #puerta {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 300;
            overflow: hidden; background: #ffe9ec;
            transition: opacity 1.2s ease;
        }
        #puerta.saliendo { opacity: 0; pointer-events: none; }
        #puertaFondo {
            position: absolute; top: -6%; right: -6%; bottom: -6%; left: -6%;
            background: url(contrasena.jpg) center / cover; filter: blur(26px) saturate(1.1);
        }
        #puertaCaja { position: absolute; font-family: 'Quicksand', 'Nunito', 'Trebuchet MS', system-ui, sans-serif; }
        #puertaImg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
        #puertaCaja .el { position: absolute; box-sizing: border-box; }

        #campoClave {
            left: 21.27%; top: 53.10%; width: 57.86%; height: 7.52%;       /* justo sobre el campo dibujado */
            display: flex; align-items: center;
            border-radius: 999px; border: calc(var(--u) * 3) solid #f2e2d6;
            background: linear-gradient(180deg, #fffdf8, #fff9ef);
            box-shadow: inset 0 calc(var(--u) * 3) calc(var(--u) * 6) rgba(210, 160, 140, 0.18);
        }
        #campoClave.error { animation: sacude 0.45s; border-color: #f0a7a0; }
        @keyframes sacude { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); }
                            60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
        #campoClave svg.candado { flex: none; width: calc(var(--u) * 34); height: calc(var(--u) * 40); margin-left: calc(var(--u) * 30); }
        #clave {
            flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
            padding: 0 calc(var(--u) * 14) 0 calc(var(--u) * 22);
            font: 600 max(16px, calc(var(--u) * 34)) 'Quicksand', 'Nunito', system-ui, sans-serif;
            color: #8b5e52; letter-spacing: 0.04em;
        }
        #clave::placeholder { color: #dcc3b8; letter-spacing: 0; }
        #ojo {
            flex: none; width: calc(var(--u) * 70); height: 100%; border: 0; background: none; cursor: pointer;
            padding: 0; margin-right: calc(var(--u) * 14); display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        #ojo svg { width: calc(var(--u) * 40); height: calc(var(--u) * 40); }

        #btnEntrar {
            left: 37.40%; top: 64.29%; width: 25.60%; height: 7.52%; cursor: pointer; padding: 0 0 calc(var(--u) * 3);
            border-radius: 999px; border: calc(var(--u) * 4) solid #e9c6b8;
            background: linear-gradient(180deg, #fcc9b8, #f3a590);
            box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 10) rgba(215, 120, 100, 0.35), inset 0 calc(var(--u) * 3) 0 rgba(255, 235, 225, 0.8);
            color: #fff; font: 700 max(16px, calc(var(--u) * 38)) 'Quicksand', 'Nunito', system-ui, sans-serif;
            text-shadow: 0 1px 3px rgba(190, 90, 70, 0.4); -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s, filter 0.2s;
        }
        #btnEntrar:hover { filter: brightness(1.05); transform: translateY(-2px); }
        #btnEntrar:active { transform: scale(0.96); }
        #btnEntrar:disabled { filter: grayscale(0.5) brightness(1.05); cursor: default; transform: none; }

        #puertaMsg {
            left: 21%; width: 58%; top: 73.6%; text-align: center; color: #b8584f; font-weight: 700;
            font-size: max(13px, calc(var(--u) * 26)); line-height: 1.2; min-height: 1.3em;
            opacity: 0; transition: opacity 0.3s;
        }
        #puertaMsg.visible { opacity: 1; }
        #puertaMsg button { border: 0; background: none; color: #d96a7e; font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }

        /* el globo de diálogo de Snoopy */
        #burbuja {
            left: 27%; top: 79.5%; width: 37%; padding: calc(var(--u) * 20) calc(var(--u) * 26);
            background: #fffaf3; border: calc(var(--u) * 4) solid #f3b7aa; border-radius: calc(var(--u) * 34);
            font-family: var(--letra-carta); font-weight: 700; color: #a8493f; text-align: center;
            font-size: max(15px, calc(var(--u) * 36)); line-height: 1.12;
            box-shadow: 0 calc(var(--u) * 8) calc(var(--u) * 14) rgba(200, 110, 100, 0.28);
            transform-origin: 100% 60%; animation: saltaBurbuja 3.2s ease-in-out infinite;
        }
        #burbuja::after {                       /* la colita del globo, apuntando a Snoopy */
            content: ''; position: absolute; right: calc(var(--u) * -26); top: 40%;
            width: calc(var(--u) * 30); height: calc(var(--u) * 30); background: #fffaf3;
            border-right: calc(var(--u) * 4) solid #f3b7aa; border-top: calc(var(--u) * 4) solid #f3b7aa;
            transform: rotate(45deg) skew(10deg, 10deg); border-radius: 0 calc(var(--u) * 8) 0 0;
        }
        #burbuja.pop { animation: popBurbuja 0.45s ease-out, saltaBurbuja 3.2s 0.45s ease-in-out infinite; }
        @keyframes popBurbuja { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
        @keyframes saltaBurbuja { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(-1deg); } }

        .corazonSalta { position: absolute; pointer-events: none; z-index: 5; font-size: 28px; }

        /* la avioneta de Snoopy que pasa saludando con un letrero */
        #saludoAvion { position: absolute; top: 2.5%; left: 0; z-index: 4; pointer-events: none; display: flex; align-items: flex-start;
                       animation: vueloSaludo 30s linear 1.2s infinite; will-change: transform; }
        #holaAvion { position: absolute; top: 9%; left: 0; z-index: 4; pointer-events: none; display: none; align-items: flex-start; will-change: transform; }
        #holaAvion.vuela { display: flex; animation: vueloHola 7s linear forwards; }
        @keyframes vueloHola { 0% { transform: translateX(-110%); } 100% { transform: translateX(100vw); } }
        #holaAvion .bob { position: relative; animation: bobSaludo 2.4s ease-in-out infinite; }
        #saludoAvion .bob { position: relative; animation: bobSaludo 2.4s ease-in-out infinite; }
        @keyframes vueloSaludo { 0% { transform: translateX(-110%); } 38% { transform: translateX(100vw); } 100% { transform: translateX(100vw); } }
        @keyframes bobSaludo { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(10px) rotate(1.5deg); } }
        #saludoAvion .cartel, #holaAvion .cartel {
            position: absolute; left: 0; display: flex; align-items: center; justify-content: center;
            font-family: 'Dancing Script', cursive; font-weight: 700; color: #fff; white-space: nowrap;
            background: linear-gradient(180deg, #ff8fb1, #ff5c86); border: 2px solid #fff;
            clip-path: polygon(0 0, 100% 0, 92% 50%, 100% 100%, 0 100%); text-shadow: 0 1px 4px rgba(140, 20, 60, 0.45);
        }
        #saludoAvion .cuerda, #holaAvion .cuerda { position: absolute; height: 2px; background: #8a5a4a; }
        #saludoAvion img, #holaAvion img { position: absolute; display: block; }

        /* botón de silencio */
        #btnMusica {
            position: fixed; top: 12px; right: 12px; z-index: 500; width: 44px; height: 44px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.9); background: rgba(255, 120, 160, 0.82); color: #fff;
            font-size: 21px; line-height: 1; cursor: pointer; padding: 0; display: none;
            box-shadow: 0 4px 12px rgba(150, 20, 60, 0.3); -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s, opacity 0.5s;
        }
        #btnMusica.visible { display: block; }
        #btnMusica:active { transform: scale(0.92); }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <!-- snoopy.gif, pareja.png y snoopy_avion.png deben estar en la MISMA carpeta que este HTML -->
    <img id="snoopy" src="snoopy.gif" alt="Snoopy bailando">
    <img id="pareja" src="pareja.png" alt="Snoopy y Fifi">

    <!-- Degradados que usan las tarjetas (se definen una sola vez) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <radialGradient id="gGlobo" cx="36%" cy="30%" r="85%">
                <stop offset="0" stop-color="#fff6f9"/>
                <stop offset="0.38" stop-color="#ffdbe7"/>
                <stop offset="0.78" stop-color="#ffb4cc"/>
                <stop offset="1" stop-color="#f58db0"/>
            </radialGradient>
            <radialGradient id="gVolumen" cx="70%" cy="78%" r="65%">
                <stop offset="0" stop-color="#d6406f" stop-opacity="0.30"/>
                <stop offset="1" stop-color="#d6406f" stop-opacity="0"/>
            </radialGradient>
        </defs>
    </svg>

    <div id="pistaFinal">Tócalos ♥</div>
    <button id="btnSig" class="btn-sig" type="button">Siguiente ♥</button>

    <script>
        const canvas = document.getElementById('c');
        let ctx = canvas.getContext('2d');          // (let: para poder dibujar un momento en un lienzo de reserva)
        // Mientras la puerta o la bienvenida tapan esta animación, no se dibuja nada (ahorra mucho trabajo)
        window.pausaPrincipal = true;
        const snoopy = document.getElementById('snoopy');
        const pareja = document.getElementById('pareja');
        const btnSig = document.getElementById('btnSig');
        const pistaFinal = document.getElementById('pistaFinal');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);

        // =====================================================
        //  AJUSTES: aquí puedes cambiar textos, colores y tiempos
        // =====================================================
        const MENSAJES = ['Te amo'];                             // el mensaje grande del centro (una línea por frase)
        const MENSAJE_LATERAL = [                                // el mensajito junto al árbol
            'Eres mi lugar favorito',
            'en todo el mundo.',
            'Gracias por florecer conmigo.'
        ];
        const CARTAS = [                                         // las 4 tarjetas de corazón (cámbialas cuando quieras)
            'Desde que llegaste, mis días tienen un color más bonito.',
            'Contigo hasta el silencio se siente como un abrazo.',
            'Eres mi pensamiento favorito a cualquier hora del día.',
            'Si pudiera elegir de nuevo, te elegiría otras mil veces.'
        ];
        const COLORES_HOJAS = ['#ff4f7e', '#ff8fab', '#ffb703', '#f48c06',
                               '#c77dff', '#9d4edd', '#ff6b6b', '#ffd6e0', '#e8416f'];
        const COLORES_IMPACTO = ['#ff4f7e', '#ff8fab', '#ff6b9a', '#ff9ebb', '#e8416f', '#c77dff', '#ffb3c6'];
        const COLORES_FINAL = ['#ffffff', '#ffd6e0', '#fff0a8', '#ff9ebb', '#ffe9a8'];
        const COLOR_PINCEL = ['#ffd84d', '#ffe27a', '#ffc933'];  // amarillos de la pincelada
        const NEBULOSA_COLORES = ['255, 120, 170', '255, 150, 205', '255, 175, 160', '210, 150, 255'];
        const FUENTE_TITULO = '"Dancing Script", "Segoe Script", "Snell Roundhand", "Brush Script MT", cursive';

        const DURACION_ONDA = 1.5;    // segundos que tarda en llenarse la pantalla
        const PAUSA_MENSAJE = 4;      // segundos que se quedan texto + Snoopy antes de irse
        const HOJAS_POR_TOQUE = [6, 10];   // hojas extra que caen cuando tocas el árbol
        const CAIDA_CADA = [0.18, 0.55];   // cada cuántos segundos se suelta una hoja sola (mínimo y máximo)
        const REBROTE = [2.5, 5];     // segundos que tarda en salir otra hojita donde se cayó una
        const REPOSO = 2.5;           // segundos que una hoja descansa en el piso antes de desvanecerse
        const DESVANECER = 1.5;       // segundos que tarda en desvanecerse
        const MAX_EN_PISO = 45;       // si hay más hojas que esto en el piso, las más viejas se van ya

        // Pide las letras desde ahora para que ya estén listas cuando se necesiten
        if (document.fonts && document.fonts.load) {
            document.fonts.load('700 48px "Dancing Script"').catch(function() {});
            document.fonts.load('700 24px "Caveat"').catch(function() {});
        }

        // =====================================================
        //  POSICIONES
        // =====================================================
        const hx = canvas.width / 2;
        const hy = canvas.height * 0.4;
        const bx = canvas.width * 0.24;
        const by = canvas.height * 0.74;
        const a = Math.atan2(hy - by, hx - bx);
        const dx = Math.cos(a);
        const dy = Math.sin(a);

        const suelo = canvas.height * 0.88;

        // ¿Pantalla vertical (celular)? Entonces el árbol va al centro y el mensaje arriba.
        // En pantalla horizontal: árbol a la derecha, mensaje a la izquierda.
        const vertical = canvas.width < canvas.height * 0.85;

        // Geometría del árbol:
        //   cx = centro horizontal del árbol
        //   R  = "radio" de la copa (la copa mide ~2.28 R de ancho y ~2.25 R de alto)
        //   yTip = punta de abajo del corazón, yc = centro del corazón matemático
        const cx = vertical ? canvas.width / 2 : canvas.width * 0.68;
        const alturaTronco = canvas.height * (vertical ? 0.20 : 0.25);
        const margenArriba = canvas.height * (vertical ? 0.27 : 0.07);
        const R = Math.min(
            (suelo - alturaTronco - margenArriba) / 2.25,
            canvas.width * (vertical ? 0.46 : 0.25) / 1.14
        );
        const yTip = suelo - alturaTronco;
        const yc = yTip - R;

        // La imagen al pie del árbol
        // pareja.png mide 740 x 585 px (ya recortada a los personajes).
        // Sus "pies" están al 94% de su altura, así que la colocamos para que
        // los pies queden un poco abajo del suelo del árbol.
        const PAREJA_ASPECTO = 585 / 740;    // alto / ancho
        const PAREJA_PIES = 0.937;           // dónde están los pies (0 = arriba, 1 = abajo)
        const anchoPareja = Math.min(
            R * 1.75,                                         // tamaño en proporción al árbol
            canvas.width * (vertical ? 0.92 : 0.30),          // sin salirse de la pantalla
            alturaTronco * 1.4 / PAREJA_ASPECTO               // sin tapar demasiado el tronco
        );
        const altoPareja = anchoPareja * PAREJA_ASPECTO;
        const piesY = suelo + (canvas.height - suelo) * 0.35; // un poquito abajo del suelo
        pareja.style.width = anchoPareja + 'px';
        pareja.style.left = cx + 'px';
        pareja.style.bottom = (canvas.height - (piesY + (1 - PAREJA_PIES) * altoPareja)) + 'px';

        // Las tarjetas de corazón: aparecen en el lugar del mensajito lateral
        //   (tx, ty) = centro del corazón de la tarjeta
        const cartaAncho = vertical
            ? Math.min(canvas.width * 0.76, canvas.height * 0.38)
            : clamp(Math.min(canvas.width * 0.30, canvas.height * 0.55), 220, 380);
        const cartaAlto = cartaAncho * 1.1;
        const CENTRO_Y = 98 / 220;           // el centro del corazón está al 44.5% de la altura de la tarjeta
        const NOTCH = (98 - 48) / 220;       // la muesca de arriba (donde se ata la cuerda) está así de arriba del centro
        const tx = vertical ? canvas.width / 2 : canvas.width * 0.24;
        const ty = vertical ? canvas.height * 0.30 : canvas.height * 0.42;
        btnSig.style.left = tx + 'px';
        btnSig.style.top = (ty + 0.50 * cartaAlto + 8) + 'px';

        // La avioneta de Snoopy (snoopy_avion.png mide 650 x 479 px)
        const AVION_ASPECTO = 479 / 650;            // alto / ancho
        const AVION_COLA = { x: 0.03, y: 0.653 };   // dónde se amarra la cuerda (la colita), en fracción de la imagen
        const avionAncho = vertical ? canvas.width * 0.40 : clamp(canvas.width * 0.17, 150, 250);
        const avionAlto = avionAncho * AVION_ASPECTO;
        const avionVel = clamp(canvas.width * 0.30, 260, 440);      // píxeles por segundo
        const cuerdaX = cartaAncho * 0.5 + avionAncho * 0.35;       // largo horizontal de la cuerda
        const cuerdaCaida = canvas.height * 0.06;                   // cuánto más abajo cuelga la tarjeta
        // altura a la que vuela: la tarjeta debe llegar justo a la altura ty
        const avionY0 = Math.max(
            avionAlto * 0.55 + canvas.height * 0.03,
            ty - NOTCH * cartaAlto - cuerdaCaida - (AVION_COLA.y - 0.5) * avionAlto
        );
        const avionImg = new Image();
        let avionListo = false;
        avionImg.onload = function() { avionListo = true; };
        avionImg.src = 'snoopy_avion.png';

        // =====================================================
        //  ESTADO
        // =====================================================
        // etapa 0 = jugando (arco y flecha)
        // etapa 1 = el corazón sale rebotado, cae y rebota en el piso
        // etapa 2 = onda rosa + mensaje + Snoopy
        // etapa 3 = todo se desvanece, crece el árbol, caen hojas y se pueden abrir las tarjetas
        let etapa = 0;
        let tEtapa = 0;
        function cambiarEtapa(n, now) {
            etapa = n;
            tEtapa = now;
            if (window.musica) window.musica.escena(n === 2 ? 'teamo' : n === 3 ? 'arbol' : 'juego');
        }

        let jalando = false;
        let dedo = {x: 0, y: 0};
        let fuerza = 0;
        let flecha = null;
        let flechaClavada = false;
        let ultimo = 0;
        let brillo = 0;          // intensidad de la nebulosa rosa alrededor del corazón (0 = apagada)

        const cor = {
            x: hx, y: hy,
            vx: 0, vy: 0,
            rot: 0, vrot: 0,
            s: 60,
            sq: 0, sqv: 0,       // compresión al golpear el piso (sq) y su velocidad (sqv)
            infl: 1,             // "inflada" antes de explotar
            asentado: false, tAsentado: 0, rotFinal: 0
        };
        const GRAVEDAD = canvas.height * 1.8;
        const EMPUJE_VY = -canvas.height * 0.5;

        const T_TEXTO = DURACION_ONDA;
        const T_GIF = T_TEXTO + MENSAJES.length * 0.8 + 1.8;

        // Árbol
        let ramas = [];
        let hojas = [];
        let caidas = [];        // hojas que se soltaron del árbol
        let tArbol = -1;        // segundos desde que empezó a crecer el árbol
        const T_GLOBOS = 8;     // cuándo (en tArbol) empiezan a subir los globos de fondo
        const T_MSG = 2.2;      // cuándo empieza a aparecer el mensajito lateral (en tArbol)
        let proxCaida = 1;      // cuenta regresiva para soltar la siguiente hoja sola
        let proxRafaga = 7;     // cuenta regresiva para un "airecito" que suelta varias juntas

        let particulas = [];    // corazoncitos de las explosiones

        // Tarjetas y avioneta
        const cartas = {
            estado: 'inactivo',   // inactivo | entrando | visible | vuelo | cerrando
            idx: 0,               // cuál tarjeta toca (0 a 3)
            t: 0,                 // segundos en el estado actual
            lateral: 1,           // visibilidad del mensajito lateral (1 = se ve)
            actual: null,         // la tarjeta que se está mostrando
            saliente: null,       // la que se está desvaneciendo
            btnOn: false
        };
        const avion = { activo: false, x: 0, y: 0, rot: 0, t: 0, soltada: false, carta: null, cuerdaFin: null };

        const fondo = ctx.createLinearGradient(0, 0, 0, canvas.height);
        fondo.addColorStop(0, '#fff8f4');
        fondo.addColorStop(1, '#ffe1df');

        // =====================================================
        //  FUNCIONES DE DIBUJO
        // =====================================================
        function corazon(cx, cy, s) {
            ctx.beginPath();
            ctx.moveTo(cx, cy + s*0.9);
            ctx.bezierCurveTo(cx - s*1.5, cy - s*0.1, cx - s*0.7, cy - s*1.1, cx, cy - s*0.4);
            ctx.bezierCurveTo(cx + s*0.7, cy - s*1.1, cx + s*1.5, cy - s*0.1, cx, cy + s*0.9);
            ctx.closePath();
            ctx.fill();
        }

        // La onda NO llena toda la pantalla: se recorta a una franja y arriba y abajo
        // quedan dos barras negras (como en el cine). BARRA = qué parte de la altura ocupa cada barra.
        const BARRA = 0.14;
        let barraPx = 0;        // alto actual de cada barra (crece con la onda y se retira al desvanecerse)

        function dibujarOnda(progreso, alpha) {
            const r = progreso * Math.hypot(canvas.width, canvas.height);
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, barraPx, canvas.width, canvas.height - 2 * barraPx);   // solo se pinta dentro de la franja
            ctx.clip();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#e8416f';
            ctx.beginPath();
            ctx.arc(cor.x, cor.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function dibujarBarras() {
            if (barraPx < 0.5) return;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, barraPx);
            ctx.fillRect(0, canvas.height - barraPx, canvas.width, barraPx);
        }

        // ---------- Globos de corazón de fondo (suben despacito cuando el árbol ya está formado) ----------
        const GLOBOS_MAX = 16;
        const GLOBOS_COLORES = [['#ffd0dc', '#ff7fa6'], ['#ffe3ec', '#ffa6c0'], ['#e6ceff', '#b783ff'],
                                ['#ffd6c2', '#ff8f85'], ['#ffc2d2', '#ff5c86'], ['#fff0f4', '#ffb3c8']];
        let globos = [];
        let proxGlobo = 0;

        function actualizarGlobos(dt) {
            const k = canvas.height / 800;
            proxGlobo -= dt;
            if (proxGlobo <= 0 && globos.length < GLOBOS_MAX) {
                const s = (16 + Math.random() * 28) * k;
                globos.push({ x: canvas.width * (0.03 + 0.94 * Math.random()), y: canvas.height + s * 3, s: s,
                              vy: (20 + Math.random() * 26) * k, t: 0, fase: Math.random() * 6.28,
                              amax: 0.3 + Math.random() * 0.22,
                              col: GLOBOS_COLORES[Math.floor(Math.random() * GLOBOS_COLORES.length)] });
                proxGlobo = 0.8 + Math.random() * 1.4;
            }
            globos.forEach(function(g) { g.t += dt; g.y -= g.vy * dt; });
            globos = globos.filter(function(g) { return g.y > -g.s * 4; });
        }

        function dibujarGlobos() {
            const H = canvas.height;
            globos.forEach(function(g) {
                const s = g.s;
                const a = g.amax * clamp((H - g.y + s) / (H * 0.18)) * clamp((g.y + s * 3) / (H * 0.25));
                if (a <= 0.005) return;
                ctx.save();
                ctx.translate(g.x + Math.sin(g.t * 0.8 + g.fase) * s * 0.7, g.y);
                ctx.rotate(Math.sin(g.t * 0.7 + g.fase) * 0.12);
                ctx.globalAlpha = a;
                // el cordelito
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.lineWidth = Math.max(1, s * 0.04);
                ctx.beginPath();
                ctx.moveTo(0, s * 1.0);
                ctx.bezierCurveTo(s * 0.25, s * 1.6, -s * 0.25, s * 2.0, 0, s * 2.7);
                ctx.stroke();
                // el globo, con degradado para que se vea redondito y brilloso
                const gr = ctx.createRadialGradient(-s * 0.4, -s * 0.4, s * 0.05, 0, 0, s * 1.3);
                gr.addColorStop(0, g.col[0]);
                gr.addColorStop(1, g.col[1]);
                ctx.fillStyle = gr;
                corazon(0, 0, s);
                // el nudito de abajo
                ctx.fillStyle = g.col[1];
                ctx.beginPath();
                ctx.moveTo(0, s * 0.88); ctx.lineTo(-s * 0.13, s * 1.1); ctx.lineTo(s * 0.13, s * 1.1);
                ctx.closePath(); ctx.fill();
                // los brillos
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.save(); ctx.translate(-s * 0.5, -s * 0.38); ctx.rotate(-0.6);
                ctx.beginPath(); ctx.ellipse(0, 0, s * 0.26, s * 0.1, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                ctx.beginPath(); ctx.arc(-s * 0.18, -s * 0.52, s * 0.05, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });
        }

        // ---------- El mensaje grande ("Te amo") con su pincelada amarilla ----------
        // Cada "cerda" del pincel es una línea con su propio temblor, grosor y largo.
        // Como no todas terminan al mismo tiempo, el final del trazo queda irregular.
        const CERDAS = [];
        for (let k = 0; k < 9; k++) {
            CERDAS.push({
                off: (k / 8) * 2 - 1 + (Math.random() - 0.5) * 0.18,   // posición dentro del grosor (-1 a 1)
                ini: Math.random() * 0.05,                              // empieza un poquito antes o después
                fin: 0.9 + Math.random() * 0.1,                         // termina un poquito antes o después
                fase: Math.random() * Math.PI * 2,
                amp: 0.4 + Math.random() * 0.8,
                color: COLOR_PINCEL[k % COLOR_PINCEL.length],
                alpha: 0.78 + Math.random() * 0.22
            });
        }

        function dibujarPincelada(x, y, ancho, progreso, tam, alphaGlobal) {
            const grosor = tam * 0.21;
            const seg = 40;
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            CERDAS.forEach(function(c) {
                const pk = clamp((progreso - c.ini) / (c.fin - c.ini));
                if (pk <= 0) return;
                ctx.strokeStyle = c.color;
                ctx.globalAlpha = alphaGlobal * c.alpha;
                ctx.lineWidth = grosor / CERDAS.length * 1.9;
                ctx.beginPath();
                for (let i = 0; i <= seg; i++) {
                    const u = i / seg * pk;                     // hasta dónde ha avanzado el trazo (0 a 1)
                    const px = x - ancho / 2 + ancho * u;
                    // una sonrisa suave que sube un poco hacia la derecha
                    const curva = Math.sin(Math.PI * u) * tam * 0.12 - u * tam * 0.10;
                    // el trazo se hace más delgado en las puntas, como al apoyar y soltar el pincel
                    const w = grosor * (0.18 + 0.82 * Math.pow(Math.sin(Math.PI * u), 0.6));
                    const temblor = Math.sin(u * 17 + c.fase) * c.amp * 1.2 + Math.sin(u * 41 + c.fase * 2) * 0.5;
                    const py = y + curva + c.off * w / 2 + temblor;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.stroke();
            });
            ctx.restore();
        }

        function dibujarMensaje(t, alphaGlobal) {
            const tam = Math.min(110, canvas.width * 0.22);
            const n = MENSAJES.length;
            const paso = tam * 1.05;
            ctx.font = `700 ${tam}px ${FUENTE_TITULO}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            let anchoMax = 0;
            MENSAJES.forEach(function(linea, i) {
                anchoMax = Math.max(anchoMax, ctx.measureText(linea).width);
                // cada línea aparece 0.8 s después de la anterior, creciendo un poquito
                const p = clamp((t - T_TEXTO - i * 0.8) / 0.9);
                const alpha = p * alphaGlobal;
                if (alpha <= 0) return;
                const esc = 0.8 + 0.2 * easeOutBack(p);
                ctx.save();
                ctx.translate(hx, hy + (i - (n - 1) / 2) * paso);
                ctx.scale(esc, esc);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.shadowColor = `rgba(120, 10, 50, ${0.28 * alpha})`;
                ctx.shadowBlur = 12;
                ctx.shadowOffsetY = 3;
                ctx.fillText(linea, 0, 0);
                ctx.restore();
            });

            // la pincelada empieza cuando ya apareció la última línea
            const tPincel = T_TEXTO + (n - 1) * 0.8 + 0.7;
            const p = clamp((t - tPincel) / 1.1);
            if (p > 0) {
                const suave = p * p * (3 - 2 * p);   // empieza y termina despacito
                dibujarPincelada(hx, hy + ((n - 1) / 2) * paso + tam * 0.55, anchoMax * 1.12, suave, tam, alphaGlobal);
            }
        }

        // Mensajito que aparece junto al árbol, línea por línea
        function dibujarMensajeLateral(now) {
            const L = cartas.lateral;          // se va cuando empiezan las tarjetas
            if (L < 0.01) return;
            const n = MENSAJE_LATERAL.length;
            const tam = vertical ? Math.min(24, canvas.width * 0.062) : Math.min(34, canvas.width * 0.026);
            const mx = vertical ? canvas.width / 2 : canvas.width * 0.24;
            const my = vertical ? canvas.height * 0.12 : canvas.height * 0.4;
            const interlineado = tam * 1.6;

            ctx.font = `italic ${tam}px Georgia, serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#b83a5e';
            MENSAJE_LATERAL.forEach(function(linea, i) {
                const alpha = clamp((tArbol - T_MSG - i * 1.3) / 1.1) * L;
                if (alpha <= 0) return;
                ctx.globalAlpha = alpha;
                // sube 8 px mientras aparece, se siente más suave
                ctx.fillText(linea, mx, my + (i - (n - 1) / 2) * interlineado + (1 - alpha) * 8);
            });

            // corazoncito arriba del mensaje
            const a0 = clamp((tArbol - T_MSG) / 1.1) * L;
            if (a0 > 0) {
                ctx.globalAlpha = a0;
                ctx.fillStyle = '#ff4f7e';
                corazon(mx, my - ((n - 1) / 2 + 1.5) * interlineado, tam * 0.4 * (1 + 0.08 * Math.sin(now / 300)));
            }

            // pista para abrir las tarjetas (late suavemente)
            const aH = clamp((tArbol - tListoCartas()) / 1.0) * L;
            if (aH > 0.01) {
                const yH = my + ((n - 1) / 2 + 1.8) * interlineado;
                ctx.globalAlpha = aH * (0.65 + 0.35 * Math.sin(now / 500));
                ctx.font = `italic ${tam * 0.78}px Georgia, serif`;
                ctx.fillStyle = '#c0587a';
                ctx.fillText('Toca el árbol', mx, yH);
                const w = ctx.measureText('Toca el árbol').width;
                corazon(mx + w / 2 + tam * 0.7, yH, tam * 0.28);
            }
            ctx.globalAlpha = 1;
        }

        // ---------- Nebulosa rosa alrededor del corazón ----------
        // Varias capas con movimiento propio, para que parezca que tiene energía:
        //  1) un halo grande que "respira"  2) nubes de colores que giran
        //  3) un aura con forma de corazón que ondula  4) chispitas que titilan
        function dibujarNebulosa(x, y, s, intensidad, now) {
            if (intensidad < 0.02) return;
            const k = Math.min(intensidad, 1.3);
            const t = now / 1000;
            ctx.save();

            const R0 = s * (3.3 + 0.3 * Math.sin(t * 1.9));
            let g = ctx.createRadialGradient(x, y, s * 0.3, x, y, R0);
            g.addColorStop(0, `rgba(255, 110, 165, ${0.42 * k})`);
            g.addColorStop(0.45, `rgba(255, 140, 190, ${0.20 * k})`);
            g.addColorStop(1, 'rgba(255, 170, 210, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(x, y, R0, 0, Math.PI * 2);
            ctx.fill();

            for (let i = 0; i < NEBULOSA_COLORES.length; i++) {
                const ang = t * (0.55 + 0.17 * i) * (i % 2 ? -1 : 1) + i * 1.9;
                const dist = s * (1.05 + 0.4 * Math.sin(t * 0.9 + i * 2.1));
                const px = x + Math.cos(ang) * dist * 1.15;
                const py = y + Math.sin(ang) * dist * 0.85;
                const r = s * (1.5 + 0.35 * Math.sin(t * 1.3 + i * 1.3));
                g = ctx.createRadialGradient(px, py, 0, px, py, r);
                g.addColorStop(0, `rgba(${NEBULOSA_COLORES[i]}, ${0.30 * k})`);
                g.addColorStop(1, `rgba(${NEBULOSA_COLORES[i]}, 0)`);
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.translate(x, y);
            ctx.shadowColor = `rgba(255, 90, 150, ${0.75 * k})`;
            ctx.shadowBlur = s * 0.7;
            ctx.fillStyle = `rgba(255, 150, 190, ${0.20 * k})`;
            corazon(0, 0, s * (1.22 + 0.07 * Math.sin(t * 2.6)));

            ctx.shadowBlur = 0;
            for (let j = 0; j < 10; j++) {
                const ang = j * 0.628 + t * 0.35 * (j % 2 ? 1 : -1);
                const d = s * (1.9 + 0.6 * Math.sin(t * 1.1 + j * 1.7));
                const tw = 0.5 + 0.5 * Math.sin(t * 3 + j * 2.3);          // titileo
                const px = Math.cos(ang) * d, py = Math.sin(ang) * d * 0.85;
                const r = s * (0.035 + 0.035 * tw);
                ctx.fillStyle = `rgba(255, 120, 170, ${0.85 * tw * Math.min(k, 1)})`;
                ctx.beginPath();            // estrellita de 4 puntas
                ctx.moveTo(px, py - r * 2.2); ctx.lineTo(px + r * 0.6, py - r * 0.6);
                ctx.lineTo(px + r * 2.2, py); ctx.lineTo(px + r * 0.6, py + r * 0.6);
                ctx.lineTo(px, py + r * 2.2); ctx.lineTo(px - r * 0.6, py + r * 0.6);
                ctx.lineTo(px - r * 2.2, py); ctx.lineTo(px - r * 0.6, py - r * 0.6);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        // ---------- Corazoncitos que salen disparados (explosiones) ----------
        function lanzarCorazones(x, y, n, op) {
            const o = Object.assign({ vmin: 120, vmax: 340, smin: 5, smax: 10, vida: [0.9, 1.5], colores: COLORES_IMPACTO }, op);
            const esc = canvas.height / 800;     // todo en proporción al tamaño de la pantalla
            for (let i = 0; i < n; i++) {
                const ang = Math.random() * Math.PI * 2;
                const v = (o.vmin + Math.random() * (o.vmax - o.vmin)) * esc;
                particulas.push({
                    x: x, y: y,
                    vx: Math.cos(ang) * v, vy: Math.sin(ang) * v,
                    rot: (Math.random() - 0.5) * 1.2, vrot: (Math.random() - 0.5) * 4,
                    s: (o.smin + Math.random() * (o.smax - o.smin)) * esc,
                    color: o.colores[Math.floor(Math.random() * o.colores.length)],
                    t: 0, vida: o.vida[0] + Math.random() * (o.vida[1] - o.vida[0])
                });
            }
        }

        function actualizarParticulas(dt) {
            for (const p of particulas) {
                p.t += dt;
                const freno = Math.max(0, 1 - 1.6 * dt);          // el aire los va frenando
                p.vx *= freno;
                p.vy = p.vy * freno + canvas.height * 0.10 * dt;   // y caen muy suavemente
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.rot += p.vrot * dt;
            }
            particulas = particulas.filter(p => p.t < p.vida);
        }

        function dibujarParticulas() {
            for (const p of particulas) {
                const u = p.t / p.vida;
                const alpha = u < 0.55 ? 1 : 1 - (u - 0.55) / 0.45;       // desaparecen suave al final
                ctx.globalAlpha = Math.max(0, alpha) * 0.95;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                corazon(0, 0, p.s * (0.7 + 0.3 * Math.min(1, u * 6)));   // nacen creciendo un poquito
                ctx.restore();
            }
            ctx.globalAlpha = 1;
        }

        // =====================================================
        //  FÍSICA DEL CORAZÓN (etapa 1)
        // =====================================================
        // Simula el rebote con vx = 1 y mide cuánto se desplaza en x.
        // Como la velocidad horizontal solo se multiplica por 0.7 en cada rebote,
        // el desplazamiento total es proporcional a vx. Así sabemos qué vx
        // darle al corazón para que caiga justo donde va a crecer el árbol.
        function desplazamientoPorUnidadDeVx() {
            let x = 0, y = hy, vx = 1, vy = EMPUJE_VY;
            const paso = 1 / 120;
            const yPiso = suelo - cor.s * 0.9;
            for (let i = 0; i < 3000; i++) {
                vy += GRAVEDAD * paso;
                x += vx * paso;
                y += vy * paso;
                if (y >= yPiso) {
                    y = yPiso;
                    if (Math.abs(vy) < canvas.height * 0.15) break;
                    vy *= -0.45;
                    vx *= 0.7;
                }
            }
            return x || 1;
        }

        function actualizarCorazon(dt, now) {
            if (cor.asentado) {
                cor.rot += (cor.rotFinal - cor.rot) * Math.min(1, dt * 12);
                // Se infla: primero se encoge un poquito (toma aire) y luego crece de golpe.
                // Al terminar explota en corazoncitos y empieza la onda rosa.
                const p = clamp((now - cor.tAsentado) / 650);
                cor.infl = p < 0.3 ? 1 - 0.1 * (p / 0.3) : 0.9 + 0.75 * Math.pow((p - 0.3) / 0.7, 2);
                if (p >= 1) {
                    lanzarCorazones(cor.x, cor.y, 24, {
                        vmin: 220, vmax: 560, smin: 7, smax: 13, vida: [1.0, 1.8], colores: COLORES_FINAL
                    });
                    cambiarEtapa(2, now);
                }
                return;
            }

            cor.vy += GRAVEDAD * dt;
            cor.x += cor.vx * dt;
            cor.y += cor.vy * dt;
            cor.rot += cor.vrot * dt;

            const yPiso = suelo - cor.s * 0.9;
            if (cor.y >= yPiso) {
                cor.y = yPiso;
                // al tocar el piso se aplasta: más fuerte cuanto más rápido caía
                cor.sq = Math.min(0.34, 0.06 + Math.abs(cor.vy) / (canvas.height * 1.4) * 0.30);
                cor.sqv = 0;
                if (Math.abs(cor.vy) < canvas.height * 0.15) {
                    cor.vx = cor.vy = cor.vrot = 0;
                    cor.asentado = true;
                    cor.tAsentado = now;
                    cor.rotFinal = Math.round(cor.rot / (Math.PI * 2)) * Math.PI * 2;
                } else {
                    cor.vy *= -0.45;
                    cor.vx *= 0.7;
                    cor.vrot *= 0.5;
                }
            }
        }

        // La compresión vuelve a 0 como un resorte (y se pasa un poquito: se estira) como una pelota
        function actualizarSquash(dt) {
            const K = 420, C = 24;
            cor.sqv += (-K * cor.sq - C * cor.sqv) * dt;
            cor.sq += cor.sqv * dt;
        }

        // =====================================================
        //  ÁRBOL EN FORMA DE CORAZÓN (etapa 3)
        // =====================================================
        // La forma: la curva clásica (x² + y² − 1)³ − x²y³ = 0.
        // Si el resultado es ≤ 0, el punto (u, v) está DENTRO del corazón.
        function valorCorazon(u, v) {
            const q = u * u + v * v - 1;
            return q * q * q - u * u * v * v * v;
        }

        // Puntos donde van a terminar las ramas (cada uno tendrá una hoja):
        //  1) un anillo sobre el borde, para que la silueta se vea bien clara
        //  2) puntos al azar dentro, separados entre sí para que no se amontonen
        function puntosDelCorazon() {
            const pts = [];
            const NBORDE = 64;
            for (let i = 0; i < NBORDE; i++) {
                const th = (i / NBORDE) * Math.PI * 2 + 0.02;
                const c = Math.cos(th), s = Math.sin(th);
                let r = 0;
                // caminamos desde el centro hacia afuera hasta salir del corazón
                while (r < 2 && valorCorazon(c * (r + 0.01), s * (r + 0.01)) <= 0) r += 0.01;
                r *= 0.93;                       // un poquito adentro, para que la hoja no sobresalga
                pts.push({u: c * r, v: s * r});
            }
            const SEPARACION = 0.125;
            for (let intento = 0; intento < 6000; intento++) {
                const u = (Math.random() * 2 - 1) * 1.14;
                const v = -1 + Math.random() * 2.26;
                if (valorCorazon(u, v) > -0.02) continue;
                if (pts.some(p => Math.hypot(p.u - u, p.v - v) < SEPARACION)) continue;
                pts.push({u: u, v: v});
            }
            // de coordenadas del corazón (u, v) a píxeles
            return pts.map(p => ({x: cx + p.u * R, y: yc - p.v * R}));
        }

        function agregarHoja(x, y, t0) {
            hojas.push({
                x: x, y: y,
                s: R * (0.038 + Math.random() * 0.022),   // un poco más grandes que antes
                color: COLORES_HOJAS[Math.floor(Math.random() * COLORES_HOJAS.length)],
                rot: (Math.random() - 0.5) * 0.8,
                fase: Math.random() * Math.PI * 2,
                inicio: t0 + Math.random() * 0.35,   // aparece cuando su rama terminó
                vacia: false,       // true = se le cayó la hoja y espera a que le salga otra
                soltando: false,    // true = ya la eligieron y está por caerse
                retardo: 0, regrow: 0
            });
        }

        // Crea las ramas dividiendo el grupo de puntos en dos mitades, una y otra vez:
        //  - la rama apunta al centro del grupo (se queda al 60% del camino)
        //  - de ahí salen dos ramas, una por mitad
        //  - cuando queda un solo punto, la rama llega hasta él y ahí va una hoja
        // Así las ramas llenan exactamente la forma del corazón.
        function crecer(x, y, pts, inicio, total) {
            const n = pts.length;
            let ex, ey;
            if (n === 1) {
                ex = pts[0].x; ey = pts[0].y;
            } else {
                let mx = 0, my = 0;
                pts.forEach(p => { mx += p.x; my += p.y; });
                mx /= n; my /= n;
                ex = x + (mx - x) * 0.6;
                ey = y + (my - y) * 0.6;
                // un pequeño desvío de lado para que no se vea tan recto
                const largo0 = Math.hypot(ex - x, ey - y) || 1;
                const desvio = (Math.random() - 0.5) * 0.25 * largo0;
                const px = -(ey - y) / largo0, py = (ex - x) / largo0;
                ex += px * desvio;
                ey += py * desvio;
            }

            const largo = Math.hypot(ex - x, ey - y);
            const dur = Math.max(0.1, largo / (R * 1.5));
            ramas.push({
                x1: x, y1: y, x2: ex, y2: ey,
                grosor: 1.2 + R * 0.055 * Math.sqrt(n / total),   // más puntos = rama más gruesa
                inicio: inicio, dur: dur
            });
            const fin = inicio + dur;

            if (n === 1) {
                agregarHoja(ex, ey, fin);
                if (Math.random() < 0.5) {      // una hojita extra al lado, para que se vea más lleno
                    const ox = ex + (Math.random() - 0.5) * R * 0.12;
                    const oy = ey + (Math.random() - 0.5) * R * 0.12;
                    if (valorCorazon((ox - cx) / R, (yc - oy) / R) < 0) agregarHoja(ox, oy, fin);
                }
                return;
            }

            // dividir por el eje donde los puntos están más separados
            let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
            pts.forEach(p => {
                minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x);
                miny = Math.min(miny, p.y); maxy = Math.max(maxy, p.y);
            });
            const horizontal = (maxx - minx) >= (maxy - miny);
            const orden = pts.slice().sort((p, q) => horizontal ? p.x - q.x : p.y - q.y);
            const mitad = n >> 1;
            crecer(ex, ey, orden.slice(0, mitad), fin, total);
            crecer(ex, ey, orden.slice(mitad), fin, total);
        }

        function crearArbol() {
            ramas = [];
            hojas = [];
            caidas = [];
            const pts = puntosDelCorazon();

            // tronco: del suelo hasta adentro de la copa
            const yRaiz = yTip - R * 0.5;
            const largoTronco = (suelo + 6) - yRaiz;
            const durTronco = largoTronco / (R * 1.5);
            ramas.push({
                x1: cx, y1: suelo + 6, x2: cx, y2: yRaiz,
                grosor: 1.2 + R * 0.055,
                inicio: 0, dur: durTronco
            });
            crecer(cx, yRaiz, pts, durTronco, pts.length);
        }

        function easeOutBack(p) {
            const c1 = 1.70158, c3 = c1 + 1;
            return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
        }

        function dibujarArbol(now) {
            ctx.strokeStyle = '#6b4a3a';
            ctx.lineCap = 'round';
            for (const r of ramas) {
                const p = clamp((tArbol - r.inicio) / r.dur);
                if (p === 0) continue;
                ctx.lineWidth = r.grosor;
                ctx.beginPath();
                ctx.moveTo(r.x1, r.y1);
                ctx.lineTo(r.x1 + (r.x2 - r.x1) * p, r.y1 + (r.y2 - r.y1) * p);
                ctx.stroke();
            }
            for (const h of hojas) {
                if (h.vacia) continue;                       // se le cayó: no la dibujamos
                const p = clamp((tArbol - h.inicio) / 0.6);
                if (p === 0) continue;
                const latido = 1 + 0.05 * Math.sin(now / 400 + h.fase);
                // si ya la eligieron para caerse, tiembla un poquito antes de soltarse
                const temblor = h.soltando ? Math.sin(now / 30 + h.fase * 5) * 1.4 : 0;
                ctx.save();
                ctx.translate(h.x + temblor, h.y);
                ctx.rotate(h.rot);
                ctx.fillStyle = h.color;
                corazon(0, 0, h.s * easeOutBack(p) * latido);
                ctx.restore();
            }
        }

        // =====================================================
        //  HOJAS QUE CAEN (solas, y también al tocar el árbol)
        // =====================================================
        function enZonaArbol(x, y) {
            return Math.abs(x - cx) < R * 1.2 && y > yc - R * 1.3 && y < suelo;
        }

        // Marca las hojas más cercanas a un punto (con un poco de azar) para que se suelten
        function soltarCercanas(px, py, cuantas) {
            const candidatas = hojas.filter(h =>
                !h.vacia && !h.soltando && (tArbol - h.inicio) >= 0.6);
            if (candidatas.length === 0) return;

            candidatas.forEach(h => {
                h.puntaje = Math.hypot(h.x - px, h.y - py) + Math.random() * R * 0.6;
            });
            candidatas.sort((p, q) => p.puntaje - q.puntaje);

            candidatas.slice(0, cuantas).forEach(h => {
                h.soltando = true;
                h.retardo = Math.random() * 0.9;   // no se sueltan todas a la vez
            });
        }

        function tocarArbol(px, py) {
            const [mn, mx] = HOJAS_POR_TOQUE;
            soltarCercanas(px, py, mn + Math.floor(Math.random() * (mx - mn + 1)));
        }

        // Una hoja cualquiera se prepara para caer (primero tiembla un momento)
        function soltarAlAzar() {
            for (let i = 0; i < 16; i++) {
                const h = hojas[Math.floor(Math.random() * hojas.length)];
                if (h && !h.vacia && !h.soltando && (tArbol - h.inicio) >= 0.6) {
                    h.soltando = true;
                    h.retardo = 0.3 + Math.random() * 0.7;
                    return;
                }
            }
        }

        // Un "airecito": 4 o 5 hojas vecinas se sueltan casi juntas
        function soltarRafaga() {
            const px = cx + (Math.random() - 0.5) * R * 1.6;
            const py = yc + (Math.random() - 0.5) * R * 1.2;
            soltarCercanas(px, py, 4 + Math.floor(Math.random() * 2));
        }

        function soltarHoja(h) {
            const balanceo = Math.random() < 0.4;    // algunas se balancean más al caer
            caidas.push({
                x0: h.x, x: h.x, y: h.y,
                vy: 0, t: 0,
                g: 0.7 + Math.random() * 0.6,                    // cada una cae con su propia "ligereza"
                vmax: 0.6 + Math.random() * 0.7,                 // y con su propia velocidad máxima
                freq: 1.5 + Math.random() * 1.5,                 // qué tan rápido se mece
                fase: Math.random() * Math.PI * 2,
                amp: R * (0.05 + Math.random() * 0.10) * (balanceo ? 1.9 : 1),   // qué tanto se mece de lado
                deriva: (Math.random() - 0.5) * R * 0.3,         // empujoncito del aire (px/s)
                giro: (Math.random() - 0.5) * 0.8,               // vueltita lenta (rad/s)
                rot0: h.rot, rot: h.rot,
                s: h.s, color: h.color,
                yPiso: suelo + canvas.height * (0.005 + Math.random() * 0.07),
                estado: 'cae',     // cae -> reposo -> desv (se desvanece)
                espera: 0, alpha: 1
            });
        }

        function actualizarHojas(dt) {
            // caída automática: una hoja cada rato, y de vez en cuando un airecito
            if (tArbol > 2.5) {
                proxCaida -= dt;
                while (proxCaida <= 0) {
                    soltarAlAzar();
                    proxCaida += CAIDA_CADA[0] + Math.random() * (CAIDA_CADA[1] - CAIDA_CADA[0]);
                }
                proxRafaga -= dt;
                if (proxRafaga <= 0) {
                    soltarRafaga();
                    proxRafaga = 7 + Math.random() * 6;
                }
            }

            for (const h of hojas) {
                if (h.soltando) {
                    h.retardo -= dt;
                    if (h.retardo <= 0) {
                        soltarHoja(h);
                        h.soltando = false;
                        h.vacia = true;
                        // a la rama le sale otra hojita en el mismo lugar, unos segundos después
                        h.regrow = REBROTE[0] + Math.random() * (REBROTE[1] - REBROTE[0]);
                    }
                } else if (h.vacia) {
                    h.regrow -= dt;
                    if (h.regrow <= 0) {
                        h.vacia = false;
                        h.inicio = tArbol;    // vuelve a brotar desde cero
                        h.color = COLORES_HOJAS[Math.floor(Math.random() * COLORES_HOJAS.length)];
                    }
                }
            }
        }

        function actualizarCaidas(dt) {
            const G = canvas.height * 0.5;       // gravedad suave (una hoja no cae como piedra)
            const VMAX = canvas.height * 0.2;    // y tiene velocidad máxima, como con el aire
            const enPiso = [];
            for (const c of caidas) {
                if (c.estado === 'cae') {
                    c.t += dt;
                    c.vy = Math.min(c.vy + G * c.g * dt, VMAX * c.vmax);
                    c.y += c.vy * dt;
                    // se mece de lado como una hojita de verdad
                    c.x = c.x0 + Math.sin(c.t * c.freq + c.fase) * c.amp + c.deriva * c.t;
                    c.rot = c.rot0 + Math.sin(c.t * c.freq + c.fase + 1.3) * 0.8 + c.giro * c.t;
                    if (c.y >= c.yPiso) {
                        c.y = c.yPiso;
                        c.estado = 'reposo';
                        c.espera = REPOSO + Math.random() * 2;
                    }
                } else if (c.estado === 'reposo') {
                    c.espera -= dt;
                    if (c.espera <= 0) c.estado = 'desv';
                    else enPiso.push(c);
                } else {
                    c.alpha -= dt / DESVANECER;
                }
            }
            // si hay demasiadas en el piso, las más viejas empiezan a desvanecerse ya
            for (let i = 0; i < enPiso.length - MAX_EN_PISO; i++) enPiso[i].estado = 'desv';
            caidas = caidas.filter(c => c.alpha > 0);
        }

        function dibujarCaidas() {
            for (const c of caidas) {
                ctx.globalAlpha = Math.max(0, c.alpha);
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.rotate(c.rot);
                ctx.fillStyle = c.color;
                corazon(0, 0, c.s);
                ctx.restore();
            }
            ctx.globalAlpha = 1;
        }

        // =====================================================
        //  TARJETAS DE CORAZÓN (globos) Y LA AVIONETA DE SNOOPY
        // =====================================================
        // Las tarjetas son HTML (para que el texto se vea nítido); la avioneta y la cuerda
        // se dibujan en el canvas. Hay DOS tarjetas que se turnan: mientras una se
        // desvanece, la otra llega colgada de la avioneta.
        const HEART_PATH = 'M100 172 C 30 118, 6 82, 24 48 C 40 18, 80 14, 100 48 C 120 14, 160 18, 176 48 C 194 82, 170 118, 100 172 Z';
        const HTML_CARTA =
            '<svg viewBox="0 0 200 220" aria-hidden="true">' +
              '<path d="M100 182 C 92 192, 108 200, 98 216" fill="none" stroke="#e3a0b6" stroke-width="1.6" stroke-linecap="round"/>' +
              '<path d="M95 171 L105 171 L100 183 Z" fill="#f08fae"/>' +
              '<path d="' + HEART_PATH + '" fill="url(#gGlobo)"/>' +
              '<path d="' + HEART_PATH + '" fill="url(#gVolumen)"/>' +
              '<path d="' + HEART_PATH + '" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.2"/>' +
              '<ellipse cx="58" cy="52" rx="20" ry="9" transform="rotate(-32 58 52)" fill="#fff" opacity="0.6"/>' +
              '<ellipse cx="38" cy="76" rx="3.5" ry="6" transform="rotate(-20 38 76)" fill="#fff" opacity="0.5"/>' +
            '</svg>' +
            '<div class="carta-texto"><span></span></div>';

        function crearCarta() {
            const el = document.createElement('div');
            el.className = 'carta';
            el.style.setProperty('--cw', cartaAncho + 'px');
            el.innerHTML = HTML_CARTA;
            document.body.appendChild(el);
            return {
                el: el, caja: el.querySelector('.carta-texto'), texto: el.querySelector('.carta-texto span'),
                x: tx, y: ty, vx: 0, vy: 0, rot: 0, vrot: 0, esc: 1,
                alfa: 0, txtAlfa: 0, modo: 'oculta', tLibre: 0, fase: 0
            };
        }
        const cartaEls = [crearCarta(), crearCarta()];

        // Escribe el mensaje y, si no cabe dentro del corazón, achica la letra hasta que quepa
        function prepararCarta(c, mensaje) {
            c.texto.textContent = mensaje;
            let tam = cartaAncho * 0.075;
            c.caja.style.fontSize = tam + 'px';
            let seguro = 0;
            while (c.texto.offsetHeight > c.caja.clientHeight && tam > 11 && seguro++ < 40) {
                tam -= 1;
                c.caja.style.fontSize = tam + 'px';
            }
            c.alfa = 0; c.txtAlfa = 0; c.tLibre = 0; c.rot = 0; c.vrot = 0;
            c.fase = Math.random() * Math.PI * 2;
        }

        // Coloca la tarjeta en pantalla: (x, y) es el centro del corazón
        function pintarCarta(c) {
            if (c.alfa <= 0.002) {
                if (c.el.style.opacity !== '0') c.el.style.opacity = '0';
                return;
            }
            c.el.style.opacity = c.alfa.toFixed(3);
            c.el.style.transform =
                'translate(' + (c.x - cartaAncho / 2).toFixed(1) + 'px, ' + (c.y - CENTRO_Y * cartaAlto).toFixed(1) + 'px) ' +
                'rotate(' + c.rot.toFixed(4) + 'rad) scale(' + c.esc.toFixed(4) + ')';
            c.caja.style.opacity = c.txtAlfa.toFixed(3);
            c.caja.style.transform = 'translateY(' + ((1 - c.txtAlfa) * 8).toFixed(1) + 'px)';
        }

        function mostrarBoton() {
            btnSig.textContent = cartas.idx < CARTAS.length - 1 ? 'Siguiente ♥' : 'Volver al árbol ♥';
            btnSig.classList.add('visible');
            cartas.btnOn = true;
        }
        function ocultarBoton() {
            btnSig.classList.remove('visible');
            cartas.btnOn = false;
        }

        // Cuándo (en segundos del árbol) ya se puede tocar para abrir las tarjetas
        function tListoCartas() {
            return T_MSG + MENSAJE_LATERAL.length * 1.3 + 0.8;
        }
        function puedeIniciarCartas() {
            return etapa === 3 && cartas.estado === 'inactivo' && tArbol > tListoCartas();
        }

        // Al terminar las tarjetas, Snoopy y Fifi se pueden tocar: eso abre el final
        let parejaActiva = false;
        function activarPareja() {
            if (parejaActiva) return;
            parejaActiva = true;
            pareja.classList.add('activa');
            const r = pareja.getBoundingClientRect();
            pistaFinal.style.left = (r.left + r.width / 2) + 'px';
            pistaFinal.style.top = Math.max(8, r.top - 6) + 'px';
            pistaFinal.classList.add('visible');
        }
        pareja.addEventListener('click', function() {
            if (!parejaActiva || cartas.estado !== 'inactivo') return;
            parejaActiva = false;
            pareja.classList.remove('activa');
            pistaFinal.classList.remove('visible');
            if (window.iniciarFinal) window.iniciarFinal();
        });

        function iniciarCartas() {
            cartas.idx = 0;
            const c = cartaEls[0];
            prepararCarta(c, CARTAS[0]);
            c.modo = 'libre'; c.x = tx; c.y = ty; c.vx = c.vy = 0; c.esc = 0.25;
            cartas.actual = c;
            cartas.saliente = null;
            cartas.estado = 'entrando';
            cartas.t = 0;
            ocultarBoton();
        }

        // Botón "Siguiente": la tarjeta actual se desvanece y llega la avioneta con la siguiente
        function siguienteCarta() {
            if (cartas.estado !== 'visible') return;
            ocultarBoton();
            cartas.saliente = cartas.actual;
            cartas.saliente.modo = 'saliendo';

            if (cartas.idx < CARTAS.length - 1) {
                cartas.idx++;
                const c = cartaEls[cartas.idx % 2];
                prepararCarta(c, CARTAS[cartas.idx]);
                c.modo = 'remolque'; c.alfa = 1; c.esc = 1;

                // la avioneta entra por la izquierda, y la tarjeta viene colgada detrás (todavía fuera de pantalla)
                avion.activo = true; avion.soltada = false; avion.cuerdaFin = null; avion.carta = c;
                avion.t = 0; avion.x = -avionAncho / 2 - 20; avion.y = avionY0; avion.rot = -0.07;
                const A = puntoCola();
                c.x = A.x - cuerdaX - 40;
                c.y = A.y + cuerdaCaida + NOTCH * cartaAlto;
                c.vx = avionVel; c.vy = 0; c.rot = 0.5; c.vrot = 0;

                cartas.actual = c;
                cartas.estado = 'vuelo';
            } else {
                cartas.actual = null;
                cartas.estado = 'cerrando';
            }
            cartas.t = 0;
        }
        btnSig.addEventListener('click', siguienteCarta);

        // ----- la avioneta -----
        function actualizarAvion(dt) {
            const av = avion;
            av.t += dt;
            av.x += avionVel * (1 + 0.04 * Math.sin(av.t * 2.1)) * dt;
            av.y = avionY0 + Math.sin(av.t * 2.4) * canvas.height * 0.012;     // sube y baja suavemente
            av.rot = -0.07 + Math.cos(av.t * 2.4) * 0.05;                      // nariz un poquito arriba, se inclina al subir/bajar
            // cuando ya soltó la tarjeta y salió de la pantalla, se acaba
            if (av.soltada && av.x - avionAncho / 2 > canvas.width + 30) av.activo = false;
        }

        // Dónde está la colita de la avioneta en la pantalla (ahí se amarra la cuerda)
        function puntoCola() {
            const lx = (AVION_COLA.x - 0.5) * avionAncho;
            const ly = (AVION_COLA.y - 0.5) * avionAlto;
            const co = Math.cos(avion.rot), si = Math.sin(avion.rot);
            return { x: avion.x + lx * co - ly * si, y: avion.y + lx * si + ly * co };
        }

        // Dónde se ata la cuerda a la tarjeta: la muesca de arriba del corazón
        function puntoAtado(c) {
            const d = NOTCH * cartaAlto * c.esc;
            return { x: c.x + Math.sin(c.rot) * d, y: c.y - Math.cos(c.rot) * d };
        }

        // La tarjeta colgada: sigue al punto de atrás de la avioneta con un resorte,
        // así se atrasa, se balancea y reacciona a los vaivenes del avión.
        function actualizarCartaRemolque(c, dt) {
            const A = puntoCola();
            const objX = A.x - cuerdaX;
            const objY = A.y + cuerdaCaida + NOTCH * cartaAlto;
            const K = 55, Cc = 9;
            c.vx += (K * (objX - c.x) - Cc * c.vx) * dt;
            c.vy += (K * (objY - c.y) - Cc * c.vy) * dt;
            c.x += c.vx * dt;
            c.y += c.vy * dt;
            // la parte de arriba del corazón "mira" hacia donde jala la cuerda
            const objRot = clamp(Math.atan2(A.x - c.x, c.y - A.y) * 0.25 + Math.sin(c.fase + avion.t * 3) * 0.05, -0.5, 0.5);
            c.vrot += (40 * (objRot - c.rot) - 7 * c.vrot) * dt;
            c.rot += c.vrot * dt;
        }

        // La tarjeta ya suelta (o ya quieta): un resorte la lleva a su lugar y luego flota como globo
        function actualizarCartaLibre(c, dt) {
            c.tLibre += dt;
            const amp = clamp(c.tLibre / 1.5);   // el balanceo aparece poco a poco
            const objX = tx + Math.sin(c.fase + c.tLibre * 1.1) * 4 * amp;
            const objY = ty + Math.sin(c.fase + c.tLibre * 1.7) * 6 * amp;
            const objR = Math.sin(c.fase + c.tLibre * 1.3) * 0.045 * amp;
            const K = 38, Cc = 8.5;
            c.vx += (K * (objX - c.x) - Cc * c.vx) * dt;
            c.vy += (K * (objY - c.y) - Cc * c.vy) * dt;
            c.x += c.vx * dt;
            c.y += c.vy * dt;
            c.vrot += (30 * (objR - c.rot) - 6 * c.vrot) * dt;
            c.rot += c.vrot * dt;
        }

        function actualizarCartas(dt) {
            const C = cartas;
            C.t += dt;

            // el mensajito lateral se va cuando empiezan las tarjetas y vuelve cuando terminan
            C.lateral += ((C.estado === 'inactivo' ? 1 : 0) - C.lateral) * Math.min(1, dt * 3);

            if (avion.activo) actualizarAvion(dt);

            // la tarjeta anterior se desvanece flotando hacia arriba
            const s = C.saliente;
            if (s) {
                s.alfa -= dt / 0.7;
                s.y -= canvas.height * 0.03 * dt;
                s.esc = Math.max(0.85, s.esc - 0.15 * dt);
                s.txtAlfa = Math.min(s.txtAlfa, Math.max(0, s.alfa));
                if (s.alfa <= 0) { s.alfa = 0; s.modo = 'oculta'; C.saliente = null; }
            }

            if (C.estado === 'entrando') {
                // primera tarjeta: sube desde abajo creciendo, con un pequeño rebote
                const c = C.actual;
                const p = clamp(C.t / 1.3);
                const e = easeOutBack(p);
                c.x = tx;
                c.y = ty + (1 - e) * canvas.height * 0.14;
                c.esc = 0.25 + 0.75 * e;
                c.alfa = clamp(p / 0.35);
                c.rot = (1 - p) * -0.25;
                c.txtAlfa = clamp((C.t - 0.8) / 0.7);
                if (C.t >= 1.5) {
                    c.vx = c.vy = c.vrot = 0; c.rot = 0; c.esc = 1; c.alfa = 1; c.txtAlfa = 1; c.tLibre = 0;
                    C.estado = 'visible'; C.t = 0;
                }
            } else if (C.estado === 'vuelo') {
                const c = C.actual;
                if (c.modo === 'remolque') {
                    actualizarCartaRemolque(c, dt);
                    // llegó a su lugar: la avioneta la suelta (o se acabó el recorrido)
                    if (c.x >= tx - 40 || !avion.activo) {
                        c.modo = 'libre'; c.tLibre = 0;
                        avion.soltada = true;
                        const P = puntoAtado(c);
                        avion.cuerdaFin = { x: P.x, y: P.y, alfa: 1 };
                    }
                } else {
                    actualizarCartaLibre(c, dt);
                    c.txtAlfa = clamp((c.tLibre - 0.5) / 0.9);      // el mensaje aparece al llegar
                    if (c.txtAlfa >= 1) { C.estado = 'visible'; C.t = 0; }
                }
            } else if (C.estado === 'visible') {
                actualizarCartaLibre(C.actual, dt);
                if (C.t > 0.6 && !C.btnOn) mostrarBoton();
            } else if (C.estado === 'cerrando') {
                if (C.t > 0.9) { C.estado = 'inactivo'; C.t = 0; activarPareja(); }
            }
        }

        function dibujarAvionYCuerda(dt) {
            if (!avion.activo) return;
            const A = puntoCola();
            const c = avion.carta;
            let P = null, alfa = 1;
            if (!avion.soltada) {
                P = puntoAtado(c);
            } else if (avion.cuerdaFin) {
                // ya soltó la tarjeta: el extremo de la cuerda se recoge hacia la avioneta y se desvanece
                const f = avion.cuerdaFin;
                f.x += (A.x - f.x) * Math.min(1, dt * 3);
                f.y += (A.y - f.y) * Math.min(1, dt * 3);
                f.alfa = Math.max(0, f.alfa - dt / 0.9);
                P = f; alfa = f.alfa;
            }
            if (P && alfa > 0.01) {
                const dist = Math.hypot(P.x - A.x, P.y - A.y);
                const mx = (A.x + P.x) / 2;
                const my = (A.y + P.y) / 2 + dist * 0.10 + Math.sin(avion.t * 5) * 3;   // la cuerda cuelga y se mueve
                ctx.save();
                ctx.globalAlpha = alfa;
                ctx.strokeStyle = '#8b6a5c';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(A.x, A.y);
                ctx.quadraticCurveTo(mx, my, P.x, P.y);
                ctx.stroke();
                ctx.restore();
            }

            // la avioneta, con una sombra discreta
            ctx.save();
            ctx.translate(avion.x, avion.y);
            ctx.rotate(avion.rot);
            ctx.shadowColor = 'rgba(150, 60, 90, 0.25)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetY = 8;
            if (avionListo) {
                ctx.drawImage(avionImg, -avionAncho / 2, -avionAlto / 2, avionAncho, avionAlto);
            } else {
                // por si todavía no carga snoopy_avion.png: una avioneta sencilla de respaldo
                ctx.fillStyle = '#d6402f';
                ctx.fillRect(-avionAncho / 2, -avionAlto * 0.1, avionAncho * 0.95, avionAlto * 0.3);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, -avionAlto * 0.2, avionAlto * 0.18, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // =====================================================
        //  EVENTOS
        // =====================================================
        canvas.addEventListener('pointerdown', function(ev) {
            dedoActivo = true;
            if (etapa === 0 && fase0 === 'mariposas') intentarAtrapar(ev.clientX, ev.clientY, performance.now());
            if (etapa === 0 && arcoK > 0.9 && !flecha && Math.hypot(ev.clientX - bx, ev.clientY - by) < 110) {
                jalando = true;
            }
            if (etapa === 3 && enZonaArbol(ev.clientX, ev.clientY)) {
                tocarArbol(ev.clientX, ev.clientY);            // caen unas hojitas extra
                if (puedeIniciarCartas()) iniciarCartas();     // y empiezan las tarjetas
            }
            dedo.x = ev.clientX;
            dedo.y = ev.clientY;
        });

        window.addEventListener('pointermove', function(ev) {
            dedoActivo = ev.pointerType !== 'touch';
            dedo.x = ev.clientX;
            dedo.y = ev.clientY;
            if (etapa === 3) {
                canvas.style.cursor = enZonaArbol(ev.clientX, ev.clientY) ? 'pointer' : 'default';
            }
        });

        window.addEventListener('pointerup', function() {
