            if (jalando && fuerza > 30) {
                flecha = { t: performance.now(), d0: fuerza };
            }
            jalando = false;
        });

        // =====================================================
        //  BUCLE PRINCIPAL
        // =====================================================
        // =====================================================
        //  CIELO CON NUBES (etapas 0, 1 y 2)
        // =====================================================
        const KP = clamp(canvas.height / 800, 0.7, 1.3);   // escala general según el tamaño de la pantalla
        const KARCO = Math.min(KP * 0.7, canvas.width / 420);                            // ← tamaño del arco y la flecha (0.7)

        const nubesCielo = [];
        function puffsNube() {                        // una nube = 5 a 7 "bolitas" que se juntan
            const k = 5 + Math.floor(Math.random() * 3), arr = [];
            for (let i = 0; i < k; i++) {
                const u = i / (k - 1), alt = Math.sin(Math.PI * u);
                arr.push({ dx: -0.42 + 0.84 * u + (Math.random() - 0.5) * 0.06,
                           dy: -0.02 - 0.12 * alt * Math.random(),
                           r: 0.11 + 0.13 * alt * (0.7 + Math.random() * 0.5) });
            }
            return arr;
        }
        (function crearNubesCielo() {
            const base = Math.max(canvas.width, canvas.height) * 0.9;
            // [x, y, ancho, velocidad, tipo]  (x, y y ancho como fracción de la pantalla; 'c' = nube con forma de corazón)
            [[0.50, 0.50, 0.26, 7, 'n'], [0.40, 0.56, 0.20, 5, 'n'], [0.62, 0.54, 0.22, 6, 'n'],
             [0.15, 0.22, 0.20, 8, 'n'], [0.82, 0.20, 0.23, 6, 'n'], [0.06, 0.58, 0.18, 5, 'n'],
             [0.92, 0.52, 0.19, 7, 'n'], [0.30, 0.09, 0.16, 9, 'n'], [0.70, 0.15, 0.15, 5, 'c']
            ].forEach(function(n) {
                nubesCielo.push({ x: canvas.width * n[0], y: canvas.height * n[1], w: n[2] * base, vel: n[3] * KP,
                                  tipo: n[4], puffs: puffsNube() });
            });
        })();

        function rutaNubeCielo(n, dy) {
            const w = n.w;
            ctx.beginPath();
            for (const p of n.puffs) {
                ctx.moveTo(p.dx * w + p.r * w, p.dy * w + dy);
                ctx.arc(p.dx * w, p.dy * w + dy, p.r * w, 0, Math.PI * 2);
            }
            ctx.rect(-0.46 * w, -0.03 * w + dy, 0.92 * w, 0.13 * w);
        }
        function rutaCorazonNube(w, dy) {            // un corazón suave, sin bolitas
            const k = w / 34;
            ctx.beginPath();
            for (let i = 0; i < 72; i++) {
                const t = i / 72 * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3) * k;
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * k + dy;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
        }
        // Cada nube se dibuja UNA vez en un lienzo pequeñito y luego solo se mueve ese dibujo
        function dibujarNubeCielo(n) {
            if (!n.sprite) {
                n.sw = Math.ceil(n.w * 1.5); n.sh = Math.ceil(n.w * 1.4); n.sx = n.sw / 2; n.sy = n.w * 0.72;
                const c = document.createElement('canvas');
                c.width = n.sw; c.height = n.sh;
                const prev = ctx; ctx = c.getContext('2d');
                ctx.translate(n.sx, n.sy);
                pintarNubeCielo(n);
                ctx = prev; n.sprite = c;
            }
            ctx.drawImage(n.sprite, n.x - n.sx, n.y - n.sy);
        }
        function pintarNubeCielo(n) {
            ctx.save();
            if (n.tipo === 'c') {
                ctx.fillStyle = 'rgba(255, 190, 215, 0.55)'; rutaCorazonNube(n.w, n.w * 0.035); ctx.fill();
                const g = ctx.createLinearGradient(0, -n.w * 0.4, 0, n.w * 0.4);
                g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#ffe6ef');
                ctx.fillStyle = g; rutaCorazonNube(n.w, 0); ctx.fill();
            } else {
                ctx.fillStyle = 'rgba(150, 185, 225, 0.55)'; rutaNubeCielo(n, n.w * 0.035); ctx.fill();
                const g = ctx.createLinearGradient(0, -n.w * 0.3, 0, n.w * 0.1);
                g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#eaf4ff');
                ctx.fillStyle = g; rutaNubeCielo(n, 0); ctx.fill();
            }
            ctx.restore();
        }

        // El cielo y el pasto no cambian: se dibujan una vez y se copian en cada cuadro
        let cSky = null, cSuelo = null;
        function lienzoReserva(fn) {
            const c = document.createElement('canvas');
            c.width = canvas.width; c.height = canvas.height;
            const prev = ctx; ctx = c.getContext('2d');
            fn();
            ctx = prev;
            return c;
        }
        function dibujarCielo(dt) {
            if (!cSky) { cSky = lienzoReserva(pintarFondoCielo); cSuelo = lienzoReserva(pintarSuelo); }
            const W = canvas.width;
            ctx.drawImage(cSky, 0, 0);
            // las nubes se mueven hacia la derecha y vuelven a entrar por la izquierda
            nubesCielo.forEach(function(n) {
                n.x += n.vel * dt;
                if (n.x - n.w * 0.7 > W) n.x = -n.w * 0.7;
                dibujarNubeCielo(n);
            });
            ctx.drawImage(cSuelo, 0, 0);
        }
        function pintarFondoCielo() {
            const W = canvas.width, H = canvas.height;
            const g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, '#62b6f2'); g.addColorStop(0.55, '#a8dbff'); g.addColorStop(1, '#e3f5ff');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
            // un solcito suave en la esquina
            const sg = ctx.createRadialGradient(W * 0.12, H * 0.1, 0, W * 0.12, H * 0.1, H * 0.4);
            sg.addColorStop(0, 'rgba(255, 246, 205, 0.9)'); sg.addColorStop(0.3, 'rgba(255, 246, 205, 0.35)');
            sg.addColorStop(1, 'rgba(255, 246, 205, 0)');
            ctx.fillStyle = sg;
            ctx.fillRect(0, 0, W, H);
        }
        function pintarSuelo() {
            const W = canvas.width, H = canvas.height;
            // el pasto donde cae el corazón y crece el árbol (la parte de arriba está en "suelo")
            ctx.fillStyle = '#b9eaa4';
            ctx.beginPath(); ctx.ellipse(W * 0.2, H, W * 0.7, H * 0.17, 0, 0, Math.PI * 2); ctx.fill();
            const gp = ctx.createLinearGradient(0, H * 0.88, 0, H);
            gp.addColorStop(0, '#86d873'); gp.addColorStop(1, '#4fb350');
            ctx.fillStyle = gp;
            ctx.beginPath(); ctx.ellipse(W / 2, H, W * 0.8, H * 0.12, 0, 0, Math.PI * 2); ctx.fill();
            const cols = ['#ffe066', '#ffffff', '#ff8fb1', '#ffe066', '#c9a2ff'];
            for (let i = 0; i < 26; i++) {              // florecitas del pasto (posiciones fijas)
                const fx = W * ((i * 0.6180339) % 1);
                const tope = H - H * 0.12 * Math.sqrt(Math.max(0, 1 - Math.pow((fx - W / 2) / (W * 0.8), 2)));
                const fy = tope + (H - tope) * (0.25 + 0.6 * ((i * 0.37) % 1));
                ctx.fillStyle = cols[i % cols.length];
                ctx.beginPath(); ctx.arc(fx, fy, 3.2 * KP, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#f08c00';
                ctx.beginPath(); ctx.arc(fx, fy, 1.2 * KP, 0, Math.PI * 2); ctx.fill();
            }
        }

        // =====================================================
        //  MARIPOSAS LUCIÉRNAGA: vuelan por la pantalla y dan destellitos de luz
        // =====================================================
        const COLORES_MARIPOSA = [['#ff8fb1', '#ffd1e0'], ['#c77dff', '#ead2ff'], ['#ffb347', '#ffe2a8'],
                                  ['#ffe066', '#fff3b8'], ['#6fb8ff', '#d3eeff'], ['#ff6b8b', '#ffc2d1'], ['#ffffff', '#ffe9f1']];
        const mariposas = [];

        // =====================================================
        //  MINIJUEGO: atrapa las mariposas antes de poder usar el arco
        // =====================================================
        const META = 6;                 // ← cuántas mariposas hay que atrapar (la dorada vale 2)
        let fase0 = 'mariposas';        // 'mariposas' → 'fin' → 'arco'
        let puntos = 0, tFase = 0, tUltimaCaptura = 0, arcoK = 0, dedoActivo = false;
        let dorada = null;
        const vuelos = [], coloresCaptura = [], ondas = [];

        function posCasilla(i) {
            const sep = Math.min(40 * KP, (canvas.width - 40) / META);
            return { x: canvas.width / 2 + (i - (META - 1) / 2) * sep, y: 62 * KP + 22 };
        }
        function nuevaMariposaBorde() {
            const izq = Math.random() < 0.5;
            return { x: izq ? -20 : canvas.width + 20, y: canvas.height * (0.1 + Math.random() * 0.6), vx: 0, vy: 0,
                tx: Math.random() * canvas.width, ty: canvas.height * (0.1 + Math.random() * 0.7), tCambio: 2,
                tam: (11 + Math.random() * 8) * KP, aleteo: 0, velAle: 11 + Math.random() * 5,
                col: COLORES_MARIPOSA[Math.floor(Math.random() * COLORES_MARIPOSA.length)],
                fase: Math.random() * 6.28, per: 3 + Math.random() * 4 };
        }
        function intentarAtrapar(x, y, now) {
            let mejor = -1, md = 1e9;
            mariposas.forEach(function(m, i) {
                const d = Math.hypot(m.x - x, m.y - y);
                if (d < m.tam * 2 + 28 && d < md) { md = d; mejor = i; }
            });
            if (mejor < 0) {                       // fallaste: ondita y corazoncitos
                ondas.push({ x: x, y: y, t: now });
                lanzarCorazones(x, y, 3);
                return;
            }
            const m = mariposas.splice(mejor, 1)[0];
            const valor = m.dorada ? 2 : 1;
            if (m.dorada) dorada = null;
            for (let k = 0; k < valor && puntos + k < META; k++) {
                vuelos.push({ m: m, x0: m.x, y0: m.y, t: now + k * 150, dur: 750, idx: puntos + k, dorada: m.dorada });
            }
            puntos = Math.min(META, puntos + valor);
            tUltimaCaptura = now;
            lanzarCorazones(m.x, m.y, m.dorada ? 16 : 7);
            mariposas.push(nuevaMariposaBorde());
            if (!dorada && puntos >= 3 && puntos < META - 1 && Math.random() < 0.6) {
                dorada = nuevaMariposaBorde();
                dorada.dorada = true; dorada.col = ['#ffd23f', '#fff3b0']; dorada.vel = 1.8; dorada.per = 1.3; dorada.tam *= 1.25;
                mariposas.push(dorada);
            }
            if (puntos >= META) { fase0 = 'fin'; tFase = now; }
        }
        function dibujarJuegoMariposas(now) {
            const t = now / 1000, cx0 = canvas.width / 2;
            // ondas por fallos
            for (let i = ondas.length - 1; i >= 0; i--) {
                const u = (now - ondas[i].t) / 600;
                if (u >= 1) { ondas.splice(i, 1); continue; }
                ctx.save(); ctx.globalAlpha = 0.6 * (1 - u); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(ondas[i].x, ondas[i].y, 8 + u * 34, 0, 6.283); ctx.stroke(); ctx.restore();
            }
            // pista si pasa mucho rato sin atrapar
            if (fase0 === 'mariposas' && now - Math.max(tUltimaCaptura, 1500) > 9000 && mariposas.length) {
                let m = mariposas[0];
                const r = 20 + 6 * Math.sin(t * 6);
                ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]);
                ctx.beginPath(); ctx.arc(m.x, m.y, m.tam * 1.6 + r * 0.5, 0, 6.283); ctx.stroke(); ctx.restore();
            }
            // píldora superior con casillas
            const sep = Math.min(40 * KP, (canvas.width - 40) / META), anchoP = Math.min(canvas.width - 16, Math.max(sep * META + 30, 310)), hP = 62 * KP + 36;
            ctx.save();
            ctx.globalAlpha = fase0 === 'arco' ? Math.max(0, 1 - arcoK) : 1;
            ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.roundRect(cx0 - anchoP / 2, 10, anchoP, hP, 22); ctx.fill(); ctx.stroke();
            ctx.font = '700 ' + clamp(canvas.width * 0.035, 17, 26) + 'px ' + FUENTE_TITULO;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(40,90,170,0.6)'; ctx.shadowBlur = 6; ctx.fillStyle = '#fff';
            ctx.fillText('Atrapa las mariposas ✨', cx0, 10 + 22 * KP);
            ctx.shadowBlur = 0;
            for (let i = 0; i < META; i++) {
                const p = posCasilla(i);
                const lleno = !!coloresCaptura[i];
                if (!lleno) {
                    ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                    ctx.beginPath(); ctx.arc(p.x, p.y, 11 * KP, 0, 6.283); ctx.fill(); ctx.stroke();
                } else {
                    const c = coloresCaptura[i] || ['#ff8fb1', '#ffd1e0'];
                    dibujarUna({ x: p.x, y: p.y, vx: 0, vy: -1, tam: 11 * KP, aleteo: t * 6 + i, col: c, fase: 0, per: 1, sinDestello: true }, t, 1);
                }
            }
            ctx.restore();
            // mariposas en vuelo hacia su casilla
            for (let i = vuelos.length - 1; i >= 0; i--) {
                const v = vuelos[i], u = (now - v.t) / v.dur;
                if (u < 0) continue;
                if (u >= 1) { coloresCaptura[v.idx] = v.m.col; vuelos.splice(i, 1); lanzarCorazones(posCasilla(v.idx).x, posCasilla(v.idx).y, 2); continue; }
                const e = u * u * (3 - 2 * u), p = posCasilla(v.idx);
                const x = v.x0 + (p.x - v.x0) * e, y = v.y0 + (p.y - v.y0) * e - Math.sin(u * Math.PI) * 60;
                dibujarUna({ x: x, y: y, vx: p.x - v.x0, vy: p.y - v.y0, tam: v.m.tam + (11 * KP - v.m.tam) * e, aleteo: t * 20, col: v.m.col, fase: 0, per: 1, sinDestello: true }, t, 1);
            }
            // mensaje de victoria
            if (fase0 === 'fin') {
                const u = clamp((now - tFase) / 500);
                ctx.save(); ctx.globalAlpha = u * (fase0 === 'fin' ? 1 : 0);
                ctx.font = '700 ' + clamp(canvas.width * 0.06, 28, 54) + 'px ' + FUENTE_TITULO;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(40,90,170,0.7)'; ctx.shadowBlur = 12; ctx.fillStyle = '#fff';
                ctx.fillText('¡Las atrapaste todas! ✨', cx0, canvas.height * 0.4);
                ctx.restore();
                if (now - tFase > 400 && Math.random() < 0.25) lanzarCorazones(cx0 + (Math.random() - 0.5) * sep * META, 62 * KP, 3);
                if (now - tFase > 2000) fase0 = 'arco';
            }
            if (fase0 === 'arco' && arcoK < 1) arcoK = Math.min(1, arcoK + 0.016);
        }
        (function crearMariposas() {
            const n = canvas.width < canvas.height ? 6 : 9;
            for (let i = 0; i < n; i++) {
                mariposas.push({
                    x: Math.random() * canvas.width, y: canvas.height * (0.1 + Math.random() * 0.7),
                    vx: 0, vy: 0, tx: Math.random() * canvas.width, ty: canvas.height * (0.1 + Math.random() * 0.7),
                    tCambio: Math.random() * 3, tam: (11 + Math.random() * 8) * KP,
                    aleteo: Math.random() * 6, velAle: 11 + Math.random() * 5,
                    col: COLORES_MARIPOSA[i % COLORES_MARIPOSA.length],
                    fase: Math.random() * 6.28, per: 3 + Math.random() * 4      // cada cuántos segundos destella
                });
            }
        })();

        function actualizarMariposas(dt, t) {
            mariposas.forEach(function(m) {
                m.tCambio -= dt;
                if (m.tCambio <= 0) {                // elige un nuevo lugar al que volar
                    m.tx = Math.random() * canvas.width;
                    m.ty = canvas.height * (0.08 + Math.random() * 0.75);
                    m.tCambio = 2 + Math.random() * 3;
                }
                const ang = Math.atan2(m.ty - m.y, m.tx - m.x), v = (38 + m.tam * 3) * (m.vel || 1);
                const k = Math.min(1, dt * 1.2);
                m.vx += (Math.cos(ang) * v - m.vx) * k;
                m.vy += (Math.sin(ang) * v - m.vy) * k;
                m.aleteo += dt * m.velAle;
                if (fase0 === 'mariposas' && dedoActivo) {          // huyen un poquito del dedo
                    const ddx = m.x - dedo.x, ddy = m.y - dedo.y, dd = Math.hypot(ddx, ddy);
                    if (dd < 90 && dd > 1) { m.vx += ddx / dd * 260 * dt; m.vy += ddy / dd * 260 * dt; }
                }
                m.x += (m.vx + Math.sin(t * 3 + m.fase) * 22) * dt;     // el vuelo tembloroso de una mariposa
                m.y += (m.vy + Math.cos(t * 2.3 + m.fase) * 26) * dt;
            });
        }

        function estrella4(x, y, r) {
            ctx.beginPath();
            ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.22, y - r * 0.22); ctx.lineTo(x + r, y);
            ctx.lineTo(x + r * 0.22, y + r * 0.22); ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.22, y + r * 0.22);
            ctx.lineTo(x - r, y); ctx.lineTo(x - r * 0.22, y - r * 0.22);
            ctx.closePath(); ctx.fill();
        }

        function dibujarMariposas(t, alfa) {
            mariposas.forEach(function(m) { dibujarUna(m, t, alfa); });
        }

        function dibujarUna(m, t, alfa) {
            (function() {
                const T = m.tam;
                // destello corto y brillante, como el de una luciérnaga
                const f = m.sinDestello ? 0 : Math.pow(Math.max(0, Math.sin(t * (Math.PI * 2 / m.per) + m.fase)), 8);
                ctx.save();
                ctx.globalAlpha = alfa;
                ctx.translate(m.x, m.y);
                if (f > 0.02) {
                    const r = T * (2.2 + 2.4 * f);
                    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
                    g.addColorStop(0, 'rgba(255, 252, 215, ' + (0.9 * f) + ')');
                    g.addColorStop(0.4, 'rgba(255, 236, 160, ' + (0.45 * f) + ')');
                    g.addColorStop(1, 'rgba(255, 230, 150, 0)');
                    ctx.fillStyle = g;
                    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'rgba(255, 255, 255, ' + f + ')';
                    estrella4(0, 0, T * 1.5 * f);
                    for (let j = 0; j < 3; j++) {         // chispitas alrededor
                        const aj = t * 2 + j * 2.1 + m.fase;
                        estrella4(Math.cos(aj) * T * 1.7, Math.sin(aj) * T * 1.7, T * 0.28 * f);
                    }
                }
                ctx.rotate(Math.atan2(m.vy, m.vx) + Math.PI / 2 + Math.sin(t * 2 + m.fase) * 0.15);
                const w = Math.abs(Math.cos(m.aleteo)) * 0.85 + 0.15;     // el aleteo: las alas se cierran y se abren
                [1, -1].forEach(function(lado) {
                    ctx.save();
                    ctx.scale(lado * w, 1);
                    ctx.fillStyle = m.col[0];
                    ctx.strokeStyle = 'rgba(110, 40, 80, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.ellipse(T * 0.55, -T * 0.35, T * 0.62, T * 0.5, 0.55, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = m.col[1];
                    ctx.beginPath(); ctx.ellipse(T * 0.42, T * 0.42, T * 0.42, T * 0.34, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                    ctx.beginPath(); ctx.arc(T * 0.62, -T * 0.4, T * 0.13, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                });
                ctx.fillStyle = '#5a2a3a';
                ctx.beginPath(); ctx.ellipse(0, 0, T * 0.09, T * 0.5, 0, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#5a2a3a'; ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, -T * 0.45); ctx.lineTo(T * 0.22, -T * 0.95);
                ctx.moveTo(0, -T * 0.45); ctx.lineTo(-T * 0.22, -T * 0.95);
                ctx.stroke();
                ctx.restore();
            })();
        }

        // =====================================================
        //  ARCO Y FLECHA (estilo caricatura: contorno oscuro, rojo brillante)
        // =====================================================
        const TINTA = '#7a1c2a';
        const LARGO_FLECHA = 135;     // en unidades del arco (se multiplica por KP al dibujar)

        function trazoArco() {                 // coordenadas locales: +x = hacia donde apunta la flecha
            ctx.beginPath();
            ctx.moveTo(2, -92);
            ctx.quadraticCurveTo(-12, -88, -4, -80);       // puntita curva de arriba
            ctx.bezierCurveTo(40, -46, 40, 46, -4, 80);    // el cuerpo del arco
            ctx.quadraticCurveTo(-12, 88, 2, 92);          // puntita curva de abajo
        }

        // Dibuja una flecha con la cola en x0 y el largo len (hacia +x). conPunta = false para la flecha ya clavada.
        function flechaGrafica(x0, len, conPunta) {
            const xT = x0 + len;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.strokeStyle = TINTA; ctx.lineWidth = 7;                 // el palito: contorno y madera clarita
            ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(xT - 8, 0); ctx.stroke();
            ctx.strokeStyle = '#f6dfb4'; ctx.lineWidth = 3.6;
            ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(xT - 8, 0); ctx.stroke();
            [-1, 1].forEach(function(lado) {                            // plumas rojas
                ctx.fillStyle = '#e63946'; ctx.strokeStyle = TINTA; ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(x0 - 8, lado * 14); ctx.lineTo(x0 + 8, lado * 14);
                ctx.lineTo(x0 + 32, lado * 2); ctx.lineTo(x0 + 16, lado * 2);
                ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = '#ff9a9a'; ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(x0 + 1, lado * 12); ctx.lineTo(x0 + 18, lado * 3);
                ctx.moveTo(x0 + 7, lado * 12); ctx.lineTo(x0 + 24, lado * 3);
                ctx.stroke();
            });
            if (conPunta) {                                             // punta gris con brillo
                ctx.fillStyle = '#dfe3ea'; ctx.strokeStyle = TINTA; ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(xT, 0); ctx.lineTo(xT - 28, -16); ctx.lineTo(xT - 20, 0); ctx.lineTo(xT - 28, 16);
                ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                ctx.moveTo(xT - 3, -1); ctx.lineTo(xT - 20, -10); ctx.lineTo(xT - 15, -1);
                ctx.closePath(); ctx.fill();
            }
        }

        function dibujarArco(now, alfa) {
            ctx.save();
            ctx.globalAlpha = alfa;
            ctx.translate(bx, by);
            ctx.rotate(a);
            ctx.scale(KARCO, KARCO);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';

            // cuanto se jala la cuerda (con un temblorcito al soltar)
            let pull = 0;
            if (jalando) pull = Math.min(80, Math.hypot(dedo.x - bx, dedo.y - by));
            fuerza = pull;
            let nock = -pull * 0.6 / KARCO;
            if (flecha) {
                const el = (now - flecha.t) / 1000;
                nock = Math.exp(-el * 9) * Math.sin(el * 70) * flecha.d0 * 0.15 / KARCO;
            }

            ctx.strokeStyle = TINTA; ctx.lineWidth = 2.4;               // la cuerda
            ctx.beginPath(); ctx.moveTo(2, -92); ctx.lineTo(nock, 0); ctx.lineTo(2, 92); ctx.stroke();

            trazoArco(); ctx.strokeStyle = TINTA; ctx.lineWidth = 17; ctx.stroke();        // contorno
            trazoArco(); ctx.strokeStyle = '#e63946'; ctx.lineWidth = 12; ctx.stroke();     // rojo
            ctx.save();                                                                    // brillo
            ctx.setLineDash([16, 12, 6, 14]); ctx.translate(-2.5, -1.5);
            trazoArco(); ctx.strokeStyle = 'rgba(255, 150, 150, 0.9)'; ctx.lineWidth = 3; ctx.stroke();
            ctx.restore();
            ctx.strokeStyle = TINTA; ctx.lineWidth = 16;                                   // empuñadura
            ctx.beginPath(); ctx.moveTo(29, -12); ctx.lineTo(29, 12); ctx.stroke();
            ctx.strokeStyle = '#b3202f'; ctx.lineWidth = 11;
            ctx.beginPath(); ctx.moveTo(29, -12); ctx.lineTo(29, 12); ctx.stroke();

            if (!flecha) flechaGrafica(nock, LARGO_FLECHA, true);          // la flecha lista en la cuerda
            ctx.restore();
        }

        // La flecha ya volando hacia el corazón (la punta va en (px, py))
        function dibujarFlechaVolando(px, py) {
            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(a);
            ctx.scale(KARCO, KARCO);
            flechaGrafica(-LARGO_FLECHA, LARGO_FLECHA, true);
            ctx.restore();
        }

        // Halo con chispitas alrededor del corazón mientras espera en el cielo
        function dibujarAureola(x, y, s, now, k) {
            if (k < 0.02) return;
            const t = now / 1000;
            const r = s * (3 + 0.3 * Math.sin(t * 2));
            const g = ctx.createRadialGradient(x, y, s * 0.3, x, y, r);
            g.addColorStop(0, 'rgba(255, 255, 255, ' + (0.6 * k) + ')');
            g.addColorStop(0.5, 'rgba(255, 220, 235, ' + (0.25 * k) + ')');
            g.addColorStop(1, 'rgba(255, 220, 235, 0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            for (let j = 0; j < 6; j++) {
                const ang = j * 1.05 + t * 0.4 * (j % 2 ? 1 : -1);
                const dist = s * (1.8 + 0.3 * Math.sin(t * 1.1 + j * 1.7));
                const tw = 0.5 + 0.5 * Math.sin(t * 3 + j * 2.3);
                ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.9 * tw * k) + ')';
                estrella4(x + Math.cos(ang) * dist, y + Math.sin(ang) * dist * 0.85, s * (0.1 + 0.1 * tw));
            }
        }

        let bobK = 1, aureolaK = 1;

        // =====================================================
        //  BUCLE PRINCIPAL
        // =====================================================
        function frame(now) {
            if (window.pausaPrincipal) { ultimo = now; requestAnimationFrame(frame); return; }
            const dt = Math.min((now - ultimo) / 1000, 0.05);
            ultimo = now;

            if (etapa <= 2) {
                // 1 y 2. cielo con nubes y pasto (el corazón vive entre las nubes)
                dibujarCielo(dt);
            } else {
                // 1. fondo
                ctx.fillStyle = fondo;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 2. montículo (el piso donde cae el corazón y crece el árbol)
                ctx.fillStyle = '#ffc9c9';
                ctx.beginPath();
                ctx.ellipse(canvas.width / 2, canvas.height, canvas.width * 0.8, canvas.height * 0.12, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // 2b. globos de corazón de fondo: empiezan cuando el árbol ya está formado
            if (etapa === 3 && tArbol > T_GLOBOS) {
                actualizarGlobos(dt);
                dibujarGlobos();
            }

            // barras negras: crecen con la onda (etapa 2) y se retiran al desvanecerse (etapa 3)
            if (etapa === 2) barraPx = canvas.height * BARRA * (1 - Math.pow(1 - clamp((now - tEtapa) / 1000 / DURACION_ONDA), 3));
            else if (etapa === 3) barraPx = canvas.height * BARRA * Math.max(0, 1 - (now - tEtapa) / 1000 / 1.5);
            else barraPx = 0;

            // 3. etapa 3: se desvanece la onda, crece el árbol, caen las hojas y se abren las tarjetas
            let t3 = 0;
            if (etapa === 3) {
                t3 = (now - tEtapa) / 1000;
                tArbol = t3 - 1;     // el árbol empieza 1 s después de que empieza el desvanecido

                // la onda y el texto se vuelven transparentes (antes del árbol, para quedar detrás)
                const alpha = Math.max(0, 1 - t3 / 1.5);
                if (alpha > 0) {
                    dibujarOnda(1, alpha);
                    dibujarMensaje(999, alpha);
                }
                dibujarBarras();

                if (tArbol > 0) {
                    actualizarHojas(dt);
                    actualizarCaidas(dt);
                    dibujarArbol(now);
                    dibujarCaidas();
                    actualizarCartas(dt);
                    dibujarAvionYCuerda(dt);
                    cartaEls.forEach(pintarCarta);
                    if (tArbol > 0.4) pareja.style.opacity = '1';
                    dibujarMensajeLateral(now);
                }
            }

            // 4. física del corazón
            if (etapa === 1) {
                actualizarCorazon(dt, now);
                actualizarSquash(dt);
            }

            // 5. nebulosa + corazón (late en la etapa 0; en la etapa 3 se encoge como semilla)
            let s = cor.s * cor.infl;
            if (etapa === 0) s = 60 * (1 + 0.06 * Math.sin(now / 260));
            if (etapa === 3) {
                s = cor.s * cor.infl * Math.max(0, 1 - t3 / 1.2);
                cor.x += (cx - cor.x) * Math.min(1, dt * 4);   // por si cayó unos px lejos del tronco
            }

            // el brillo aparece con el flechazo, se mantiene mientras cae y se apaga al explotar
            const objBrillo = etapa === 0 ? (flechaClavada ? 1 : 0) : (etapa === 1 ? 0.9 : 0);
            brillo += (objBrillo - brillo) * Math.min(1, dt * (objBrillo > brillo ? 8 : 4));
            // en el cielo el corazón flota suavecito; al disparar se queda quieto
            bobK += (((etapa === 0 && !flecha && !flechaClavada) ? 1 : 0) - bobK) * Math.min(1, dt * 10);
            const bob = Math.sin(now / 650) * 5 * KP * bobK;
            aureolaK += (((etapa === 0 && !flechaClavada) ? 1 : 0) - aureolaK) * Math.min(1, dt * 5);
            dibujarAureola(cor.x, cor.y + bob, s, now, aureolaK);
            dibujarNebulosa(cor.x, cor.y + bob, s, brillo, now);

            if (s > 0.5) {
                ctx.save();
                ctx.translate(0, bob);
                // la compresión se apoya en la punta del corazón, que es la que toca el piso
                const base = s * 0.9;
                const estira = etapa === 1 && !cor.asentado ? clamp(Math.abs(cor.vy) / (canvas.height * 8), 0, 0.12) : 0;
                ctx.translate(cor.x, cor.y + base);
                ctx.scale(1 + cor.sq * 0.75 - estira * 0.6, 1 - cor.sq + estira);
                ctx.translate(0, -base);
                ctx.rotate(cor.rot);
                const gc = ctx.createRadialGradient(-s * 0.35, -s * 0.45, s * 0.05, 0, 0, s * 1.3);
                gc.addColorStop(0, '#ffa6c0'); gc.addColorStop(0.45, '#ff4f7e'); gc.addColorStop(1, '#d92f63');
                ctx.fillStyle = gc;
                corazon(0, 0, s);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';          // borde de luz
                ctx.lineWidth = Math.max(2, s * 0.04);
                ctx.stroke();
                ctx.save();                                              // brillo de globo
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.translate(-s * 0.5, -s * 0.4); ctx.rotate(-0.55);
                ctx.beginPath(); ctx.ellipse(0, 0, s * 0.26, s * 0.11, 0, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
                if (flechaClavada && etapa < 3) {                        // la flecha clavada
                    ctx.rotate(a);
                    ctx.scale(KARCO * 0.8, KARCO * 0.8);
                    flechaGrafica(-100, 100, false);
                }
                ctx.restore();
            }

            // 5b. mariposas luciérnaga (mientras se ve el cielo)
            if (etapa <= 2) {
                actualizarMariposas(dt, now / 1000);
                dibujarMariposas(now / 1000, 1);
                if (etapa === 0) dibujarJuegoMariposas(now);
            }

            // 6. arco y flecha (se juega en la etapa 0; el arco se desvanece justo después del flechazo)
            if (etapa === 0 || (etapa === 1 && (now - tEtapa) < 900)) {
                dibujarArco(now, etapa === 0 ? arcoK : 1 - (now - tEtapa) / 900);
            }
            if (etapa === 0) {
                // una pista para que se sepa qué hacer (solo antes del primer disparo)
                if (!flecha && !flechaClavada && arcoK > 0.9) {
                    const a0 = clamp((now / 1000 - 1.5) / 1.5) * (jalando ? 0 : 0.8 + 0.2 * Math.sin(now / 300));
                    if (a0 > 0.01) {
                        const tam = clamp(canvas.width * 0.03, 20, 30);
                        ctx.font = '700 ' + tam + 'px ' + FUENTE_TITULO;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        const txt = 'Jala el arco y suelta ♥';
                        const wt = ctx.measureText(txt).width;
                        const px = clamp(bx, wt / 2 + 10, canvas.width - wt / 2 - 10);
                        ctx.globalAlpha = a0;
                        ctx.shadowColor = 'rgba(40, 90, 170, 0.6)'; ctx.shadowBlur = 8;
                        ctx.fillStyle = '#fff';
                        ctx.fillText(txt, px, by + 112 * KP);
                        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
                    }
                }

                if (flecha) {
                    // la flecha vuela en línea recta: la punta va de donde estaba en la cuerda hasta el centro del corazón
                    const u = Math.min((now - flecha.t) / 550, 1);
                    const largo = LARGO_FLECHA * KARCO - flecha.d0 * 0.6;
                    const sx0 = bx + dx * largo, sy0 = by + dy * largo;
                    dibujarFlechaVolando(sx0 + (hx - sx0) * u, sy0 + (hy - sy0) * u);

                    if (u >= 1) {
                        // ¡impacto! El empujón horizontal se calcula para que el corazón
                        // termine de rebotar justo en la base del árbol (cx).
                        flecha = null;
                        flechaClavada = true;
                        cor.vx = (cx - hx) / desplazamientoPorUnidadDeVx();
                        cor.vy = EMPUJE_VY;
                        cor.vrot = 4;
                        brillo = 1.7;                      // destello de la nebulosa
                        lanzarCorazones(hx, hy, 14);       // corazoncitos saltando desde el punto de impacto
                        cambiarEtapa(1, now);
                    }
                }
            }

            // 7. onda rosa + mensaje + Snoopy
            if (etapa === 2) {
                const t = (now - tEtapa) / 1000;
                dibujarOnda(Math.min(t / DURACION_ONDA, 1), 1);
                dibujarMensaje(t, 1);
                dibujarBarras();

                if (t > T_GIF) snoopy.style.opacity = '1';

                if (t > T_GIF + PAUSA_MENSAJE) {
                    snoopy.style.opacity = '0';
                    crearArbol();
                    cambiarEtapa(3, now);
                }
            }

            // 8. corazoncitos de las explosiones (van encima de todo lo del canvas)
            actualizarParticulas(dt);
            dibujarParticulas();

            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>

        const PISTA_TOCAR = 'Tócalo ♥';                         // aparece cuando ya lo encontró
                const MENSAJE_FINAL = [
            'Mi amor, quiero que sepas cuánto te amo. Cada día que pasa me enamoro muchísimo más de ti. Me encanta absolutamente todo de ti: tu sonrisa, tus ojitos, tu pelito, tu carita hermosa, tu risa que tanto me cautiva y tu voz, que para mí es como el canto de los ángeles. No tienes idea de lo feliz que me hace simplemente tenerte en mi vida.',
