            'Me haces inmensamente feliz con cada besito, con tus abrazos llenos de ternura, con tus palabras y con cada muestra de cariño. Eres mi refugio, mi lugar seguro y una de las razones más bonitas de mi felicidad. Si algo tengo claro es que lo único que quiero es hacerte muy feliz, cuidarte, amarte y demostrarte de todas las maneras posibles lo importante que eres para mí.',
            'Hice esto con muchísimo cariño para que nunca olvides cuánto te amo y lo especial que eres para mí. Sé que te gusta muchísimo Snoopy y por eso quise ponerlo, porque tú y yo somos Snoopy y Fifi. Y así como ellos, quiero que sigamos compartiendo muchísimos momentos bonitos juntos.',
            'Te amo muchísimoooo, mi niña hermosa. Nunca dudes de lo enamorado que estoy de ti. Eres una personita maravillosa y me siento muy afortunado de poder llamarte mi novia. 💗🥺'
        ];
        const VEL_MENSAJE = 16;     // qué tan rápido se desplaza el mensaje (píxeles por segundo)
        const IMAGEN_RECOSTADO = 'recostado.png';                // opcional: imagen de quien descansa al pie del árbol
        const FUENTE = '"Dancing Script", "Segoe Script", "Snell Roundhand", "Brush Script MT", cursive';

        // Flores: la primera (amarilla) es la más común; las demás aparecen "de vez en cuando"
        const FLORES = [
            { petalo: '#ffd93b', centro: '#f08c00' },   // amarilla
            { petalo: '#ff8fb1', centro: '#fff0a0' },   // rosa
            { petalo: '#ffffff', centro: '#ffcf3a' },   // blanca
            { petalo: '#c49bf5', centro: '#fff3b0' },   // morada
            { petalo: '#ff5a6e', centro: '#ffe27a' },   // roja
            { petalo: '#8ec5ff', centro: '#fff3b0' },   // azul
            { petalo: '#ffb36b', centro: '#7a4a1f' }    // naranja
        ];

        btnOk.textContent = TEXTO_BOTON;
        MENSAJE_FINAL.forEach(function(t, i) {
            const p = document.createElement('p');
            if (i === MENSAJE_FINAL.length - 1) p.className = 'firma';
            p.textContent = t;
            mensajeEl.appendChild(p);
        });
        preguntaTxt.textContent = PREGUNTA;
        if (document.fonts && document.fonts.load) {
            document.fonts.load('700 40px "Dancing Script"').catch(function() {});
        }

        // =====================================================
        //  UTILIDADES
        // =====================================================
        const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);
        const lerp = (a, b, t) => a + (b - a) * t;
        const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        function easeOutBack(p) {
            const c1 = 1.70158, c3 = c1 + 1;
            return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
        }
        // Un "azar" con semilla: da siempre los mismos números, así el campo se ve igual cada vez
        function semilla(a) {
            return function() {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        // =====================================================
        //  MEDIDAS DE LA PANTALLA (se recalculan si giras el celular)
        // =====================================================
        let W, H, dpr, vertical;
        let horizonte;          // altura donde empieza el pasto lejano
        let hx, hy, sH;         // corazón escondido: posición y tamaño
        let sGrande, cenX, cenY;// corazón grande de la invitación
        let arbolX, arbolBase, arbolAlto;

        // ---- BARRER EL CAMPO: al pasar el dedo o el mouse, TODAS las flores cercanas se mueven como si pasaras corriendo ----
        const PROGRESO_PARA_ENCONTRAR = 0.45;   // ← cuánto hay que mover las flores cerca del corazón para que aparezca (0 a 1)
        const AGITACION_FUERZA = 20;            // ← cuántos píxeles se mueven las flores al pasar (más = más movimiento)
        const AGITACION_RADIO = 2.6;            // ← qué tan ancho es el "barrido" (en tamaños de corazón)
        const CW = 4, PASO_FILA = 14;           // tamaño de cada trocito de campo (delgadito, para que no se note la división)
        let descubierto = false, progresoBarrido = 0, revK = 0, recorrido = 0;
        let bR = null, ag = null, dr = null, vistas = null, bCols = 1, bFilas = 1, bFila0 = 0;
        let celdasTotal = 1, celdasMarcadas = 0, bRad = 60, ultPunto = null;

        function prepararBarrido() {
            bR = { x: 0, y: y0Campo, w: W, h: H - y0Campo };       // el barrido vale en TODO el campo
            bRad = Math.max(sH * AGITACION_RADIO, 60);
            bCols = Math.ceil(W / CW);
            bFila0 = 0;
            bFilas = Math.ceil((H - y0Campo) / PASO_FILA);
            ag = new Float32Array(bCols * bFilas); dr = new Float32Array(bCols * bFilas); vistas = new Uint8Array(bCols * bFilas);
            celdasTotal = 0; celdasMarcadas = 0;
            for (let j = 0; j < bFilas; j++) for (let i = 0; i < bCols; i += 3) {
                if (Math.hypot((i + 0.5) * CW - hx, y0Campo + (j + 0.5) * PASO_FILA - hy) < sH * 3.5) celdasTotal++;
            }
            progresoBarrido = descubierto ? 1 : 0;
        }

        function pasar(x, y, dirx) {            // agita las flores alrededor de (x, y)
            const R = bRad * 1.5;
            const i0 = Math.max(0, Math.floor((x - R) / CW)), i1 = Math.min(bCols - 1, Math.ceil((x + R) / CW));
            const j0 = Math.max(0, Math.floor((y - R - y0Campo) / PASO_FILA)), j1 = Math.min(bFilas - 1, Math.ceil((y + R - y0Campo) / PASO_FILA));
            for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
                const cx = (i + 0.5) * CW, cy = y0Campo + (j + 0.5) * PASO_FILA;
                const d = Math.hypot(cx - x, (cy - y) * 1.4);
                if (d > R) continue;
                const k = j * bCols + i, u = 1 - d / R, f = u * u * (3 - 2 * u);     // se apaga suavecito hacia los lados
                if (f > ag[k]) ag[k] = f;
                dr[k] += (dirx - dr[k]) * 0.5;
                if (d < bRad && !vistas[k] && Math.hypot(cx - hx, cy - hy) < sH * 3.5 && i % 3 === 0) { vistas[k] = 1; celdasMarcadas++; }
            }
        }

        function barrer(x, y) {
            if (!bR || estado !== 'escena') return;
            if (y < y0Campo - bRad || y > H + bRad) { ultPunto = null; return; }
            if (ultPunto) {
                const dxm = x - ultPunto.x, d = Math.hypot(dxm, y - ultPunto.y), n = Math.max(1, Math.ceil(d / (bRad * 0.5)));
                const dirx = d > 0.5 ? clamp(dxm / d, -1, 1) : 0;
                recorrido += d;
                for (let i = 1; i <= n; i++) pasar(ultPunto.x + (x - ultPunto.x) * i / n, ultPunto.y + (y - ultPunto.y) * i / n, dirx);
            } else pasar(x, y, 0);
            ultPunto = { x: x, y: y };
            // aparece al mover las flores cerca del corazón (o, si se juega por otro lado, tras mover bastante el campo)
            progresoBarrido = Math.max(celdasMarcadas / celdasTotal, recorrido / (W * 6));
            if (!descubierto && progresoBarrido >= PROGRESO_PARA_ENCONTRAR) {
                descubierto = true;
                for (let i = 0; i < 14; i++) chispas.push({ x: hx + (Math.random() - 0.5) * sH * 3, y: hy + (Math.random() - 0.2) * sH,
                    t: 0, vida: 1.4 + Math.random() * 1.2, fase: Math.random() * 6, s: sH * (0.14 + Math.random() * 0.12) });
            }
        }

        function actualizarAgitacion(dt) {
            if (!ag) return;
            const f = Math.exp(-dt * 1.1);       // se calman poco a poco, volviendo al viento natural
            for (let k = 0; k < ag.length; k++) { if (ag[k] > 0.004) ag[k] *= f; else ag[k] = 0; }
        }

        // Dibuja una capa del campo; donde se pasó, cada trocito delgado se mueve un poco más (suave, sin deformar)
        function dibujarCapaAgitada(capa, t, k) {
            ctx.save();
            ctx.beginPath(); ctx.rect(bR.x, bR.y, bR.w, bR.h); ctx.clip();
            for (let j = 0; j < bFilas; j++) {
                const y = j * PASO_FILA, dy = y0Campo + y;
                const hh = Math.min(PASO_FILA + 1, H - dy);
                if (hh <= 0) break;
                const prof = clamp((dy - horizonte) / (H - horizonte));
                const off = (Math.sin(t * 1.3 + dy * 0.02) * (0.8 + 2.4 * prof) + Math.sin(t * 0.7 + y * 0.05) * 0.5) * (H / 800);
                const sy = Math.round(y * dpr), sh = Math.min(Math.round(hh * dpr), capa.height - sy);
                if (sh <= 0) break;
                const base = j * bCols;
                let i = 0;
                while (i < bCols) {
                    if (ag[base + i] <= 0.01) {                // trocitos tranquilos: se dibujan juntos, de un solo golpe
                        let n = 1;
                        while (i + n < bCols && ag[base + i + n] <= 0.01) n++;
                        const dx = i * CW;
                        ctx.drawImage(capa, (dx - off) * dpr, sy, n * CW * dpr, sh, dx, dy, n * CW, sh / dpr);
                        i += n;
                    } else {                                  // trocito agitado: el movimiento cambia despacito de un trocito al vecino
                        const a = ag[base + i], dx = i * CW;
                        const ex = a * AGITACION_FUERZA * k * (dr[base + i] * 0.75 + Math.sin(t * 7 + dx * 0.012 + dy * 0.02) * 0.6);
                        ctx.drawImage(capa, (dx - off - ex) * dpr, sy, (CW + 0.6) * dpr, sh, dx, dy, CW + 0.6, sh / dpr);
                        i++;
                    }
                }
            }
            ctx.restore();
        }

        // La altura (y) del borde de cada colina en una posición x. capa 0 = lejana, 2 = la de enfrente
        function colina(x, capa) {
            const u = x / W;
            if (capa === 0) return horizonte + H * 0.03 * Math.sin(u * 3.2 + 0.6) + H * 0.012 * Math.sin(u * 7.1);
            if (capa === 1) return horizonte + H * 0.12 + H * 0.035 * Math.sin(u * 2.4 + 2.1) + H * 0.010 * Math.sin(u * 6);
            return horizonte + H * 0.27 + H * 0.030 * Math.sin(u * 2.0 + 4.0) + H * 0.008 * Math.sin(u * 5.3);
        }

        function medir() {
            W = window.innerWidth;
            H = window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 1.5); // nítido en pantallas finas, sin gastar de más
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            vertical = W < H * 0.85;
            horizonte = H * (vertical ? 0.40 : 0.48);
            hx = W * 0.5;
            hy = H * 0.80;
            sH = clamp(H * 0.042, 22, 40);
            sGrande = Math.min(W * 0.80 / 1.7, H * 0.60 / 1.535);
            cenX = W / 2;
            cenY = H / 2 - 0.13 * sGrande;       // el corazón queda centrado en la pantalla

            arbolX = W * (vertical ? 0.70 : 0.74);
            arbolBase = colina(arbolX, 0) + 3;
            arbolAlto = H * 0.17;
        }

        // =====================================================
        //  CREAR LA ESCENA: flores, pasto y nubes
        // =====================================================
        let elementos = [];     // flores y pasto, ordenados de lejos a cerca
        let nubes = [];
        let tCorazonNube = 8;   // segundos para que salga la próxima nube con forma de corazón

        function nuevaFlor(x, y, azar, alto) {
            const t = clamp((y - horizonte) / (H - horizonte));
            const esc = (0.35 + 1.0 * t) * (H / 800);        // más lejos = más chiquita
            const r = azar();
            const tipo = r < 0.58 ? FLORES[0] : FLORES[1 + Math.floor(azar() * (FLORES.length - 1))];
            return {
                clase: 'flor', x: x, y: y, esc: esc,
                alto: alto || (16 + azar() * 16) * esc,
                pr: (4.6 + azar() * 1.8) * esc,              // tamaño de los pétalos
                n: 5 + Math.floor(azar() * 3),               // cuántos pétalos
                col: tipo, fase: azar() * 6.28
            };
        }

        function crearEscena() {
            const azar = semilla(20261121);
            const flores = [];
            const pastos = [];

            // flores repartidas por el campo (más hacia el frente)
            const nf = clamp(Math.round(W * H / 8000), 60, 180);
            for (let i = 0; i < nf; i++) {
                const x = azar() * W;
                const yTop = colina(x, 1) + H * 0.012;
                const y = yTop + (H * 0.985 - yTop) * Math.pow(azar(), 0.8);
                flores.push(nuevaFlor(x, y, azar));
            }

            // matitas de pasto
            const np = clamp(Math.round(W * H / 2600), 150, 520);
            for (let i = 0; i < np; i++) {
                const x = azar() * W;
                const yTop = colina(x, 1) + H * 0.008;
                const y = yTop + (H * 0.995 - yTop) * Math.pow(azar(), 0.8);
                const t = clamp((y - horizonte) / (H - horizonte));
                pastos.push({ clase: 'pasto', x: x, y: y, esc: (0.35 + 1.0 * t) * (H / 800),
                              fase: azar() * 6.28, n: 3 + Math.floor(azar() * 3) });
            }

            // las flores y el pasto de ADELANTE del corazón: lo van a tapar un poquito
            [[-0.95, 0.95], [0.95, 0.85], [0.15, 1.5], [-0.4, 1.15], [0.6, 1.25]].forEach(function(o) {
                const f = nuevaFlor(hx + o[0] * sH, hy + o[1] * sH, azar, (o[1] - 0.3) * sH);
                f.esc = 1.5 * (H / 800); f.pr = 7 * f.esc / 1.5 * 1.0; f.n = 6;
                f.col = o[0] > 0.5 ? FLORES[1] : FLORES[0];
                flores.push(f);
            });
            [-1.1, -0.7, -0.3, 0.1, 0.5, 0.9, 1.2].forEach(function(ox, i) {
                pastos.push({ clase: 'pasto', x: hx + ox * sH, y: hy + (0.95 + (i % 3) * 0.2) * sH,
                              esc: 2.0 * (H / 800), fase: azar() * 6.28, n: 4 });
            });

            elementos = flores.concat(pastos).sort((p, q) => p.y - q.y);
        }

        function nuevaNube(x, tipo) {
            const esc = 0.65 + Math.random() * 0.85;
            const w = clamp(W * 0.15, 95, 240) * esc * (tipo === 'corazon' ? 0.85 : 1);
            const puffs = [];
            if (tipo === 'normal') {                 // 5 a 7 "bolitas" que forman la nube
                const k = 5 + Math.floor(Math.random() * 3);
                for (let i = 0; i < k; i++) {
                    const u = i / (k - 1);
                    const alt = Math.sin(Math.PI * u);
                    puffs.push({ dx: -0.42 + 0.84 * u + (Math.random() - 0.5) * 0.06,
                                 dy: -0.02 - 0.12 * alt * Math.random(),
                                 r: 0.11 + 0.13 * alt * (0.7 + Math.random() * 0.5) });
                }
            }
            return { x: x, y: H * (0.05 + Math.random() * (vertical ? 0.28 : 0.30)), w: w, tipo: tipo,
                     vel: (9 + esc * 15) * clamp(W / 1400, 0.7, 1.3), puffs: puffs };
        }

        function crearNubes() {
            nubes = [];
            const n = vertical ? 5 : 8;
            for (let i = 0; i < n; i++) {
                nubes.push(nuevaNube(Math.random() * W * 1.1 - W * 0.05, i === 2 ? 'corazon' : 'normal'));
            }
        }

        // Las nubes se mueven hacia la derecha; al salir vuelven a entrar por la izquierda.
        // Cada cierto tiempo, la que vuelve a entrar es una nube con forma de corazón.
        function actualizarNubes(dt) {
            tCorazonNube -= dt;
            for (let i = 0; i < nubes.length; i++) {
                const n = nubes[i];
                n.x += n.vel * dt;
                if (n.x - n.w * 0.7 > W) {
                    const hayCorazon = nubes.some(o => o !== n && o.tipo === 'corazon');
                    const corazon = tCorazonNube <= 0 && !hayCorazon;
                    if (corazon) tCorazonNube = 14 + Math.random() * 10;
                    const nueva = nuevaNube(0, corazon ? 'corazon' : 'normal');
                    nueva.x = -nueva.w * 0.7;
                    nubes[i] = nueva;
                }
            }
        }

        // =====================================================
        //  FORMAS
        // =====================================================
        // El mismo corazón de la animación (con s = tamaño)
        function trazoCorazon(cx, cy, s) {
            ctx.beginPath();
            ctx.moveTo(cx, cy + s * 0.9);
            ctx.bezierCurveTo(cx - s * 1.5, cy - s * 0.1, cx - s * 0.7, cy - s * 1.1, cx, cy - s * 0.4);
            ctx.bezierCurveTo(cx + s * 0.7, cy - s * 1.1, cx + s * 1.5, cy - s * 0.1, cx, cy + s * 0.9);
            ctx.closePath();
        }
        function corazon(cx, cy, s) { trazoCorazon(cx, cy, s); ctx.fill(); }

        function estrellita(x, y, r) {
            ctx.beginPath();
            ctx.moveTo(x, y - r * 2.2); ctx.lineTo(x + r * 0.6, y - r * 0.6);
            ctx.lineTo(x + r * 2.2, y); ctx.lineTo(x + r * 0.6, y + r * 0.6);
            ctx.lineTo(x, y + r * 2.2); ctx.lineTo(x - r * 0.6, y + r * 0.6);
            ctx.lineTo(x - r * 2.2, y); ctx.lineTo(x - r * 0.6, y - r * 0.6);
            ctx.closePath();
            ctx.fill();
        }

        // =====================================================
        //  DIBUJO: CIELO Y NUBES
        // =====================================================
        // ---- Capas que no cambian: se dibujan una vez y después solo se copian en cada cuadro ----
        let cCielo, cColinas, cAtras, cFrente, y0Campo = 0;
        function lienzoNuevo(w, h) {
            const c = document.createElement('canvas');
            c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
            return c;
        }
        function enReserva(c, dy, fn) {
            const prev = ctx; ctx = c.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, -dy * dpr);
            fn();
            ctx = prev;
        }
        function construirCaches() {
            cCielo = lienzoNuevo(W, H);
            enReserva(cCielo, 0, dibujarCielo);
            cColinas = lienzoNuevo(W, H);                     // colinas + árbol + persona recostada
            enReserva(cColinas, 0, function() {
                dibujarColina(0, '#b5e8a0', '#8fd47f');
                dibujarArbol(0);
                dibujarColina(1, '#8bd673', '#6cc260');
                dibujarColina(2, '#6cc45f', '#4aa347');
            });
            // flores y pasto: las de ATRÁS del corazón escondido y las de ADELANTE (lo tapan un poquito)
            y0Campo = Math.max(0, Math.floor(horizonte - 4));
            prepararBarrido();
            cAtras = lienzoNuevo(W, H - y0Campo);
            cFrente = lienzoNuevo(W, H - y0Campo);
            const pintar = function(c, delante) {
                enReserva(c, y0Campo, function() {
                    for (const e of elementos) {
                        if ((e.y > hy) !== delante) continue;
                        if (e.clase === 'flor') dibujarFlor(e, 0); else dibujarPasto(e, 0);
                    }
                });
            };
            pintar(cAtras, false);
            pintar(cFrente, true);
        }
        // El viento: la capa se copia en tiras y cada tira se mueve un poquito distinto, como una ola en el pasto
        function dibujarCampo(c, t) {
            const alto = H - y0Campo, paso = 14;
            for (let y = 0; y < alto; y += paso) {
                const hh = Math.min(paso + 1, alto - y);
                const prof = clamp((y0Campo + y - horizonte) / (H - horizonte));
                const off = (Math.sin(t * 1.3 + (y0Campo + y) * 0.02) * (0.8 + 2.4 * prof) + Math.sin(t * 0.7 + y * 0.05) * 0.5) * (H / 800);
                const sy = Math.round(y * dpr), sh = Math.min(Math.round(hh * dpr), c.height - sy);
                if (sh <= 0) break;
                ctx.drawImage(c, 0, sy, c.width, sh, off, y0Campo + y, W, sh / dpr);
            }
        }

        function dibujarCielo() {
            const g = ctx.createLinearGradient(0, 0, 0, horizonte + H * 0.1);
            g.addColorStop(0, '#6fbff2');
            g.addColorStop(0.6, '#a9dcff');
            g.addColorStop(1, '#e4f6ff');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);

            // un solcito suave en la esquina
            const sx = W * 0.15, sy = H * 0.14, sr = H * 0.35;
            const s = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
            s.addColorStop(0, 'rgba(255, 246, 205, 0.85)');
            s.addColorStop(0.25, 'rgba(255, 246, 205, 0.35)');
            s.addColorStop(1, 'rgba(255, 246, 205, 0)');
            ctx.fillStyle = s;
            ctx.fillRect(0, 0, W, H);
        }

        // La forma de una nube normal: varias bolitas que se juntan + una base planita
        function rutaNube(n, dy) {
            const w = n.w;
            ctx.beginPath();
            for (const p of n.puffs) {
                ctx.moveTo(p.dx * w + p.r * w, p.dy * w + dy);
                ctx.arc(p.dx * w, p.dy * w + dy, p.r * w, 0, Math.PI * 2);
            }
            ctx.rect(-0.46 * w, -0.03 * w + dy, 0.92 * w, 0.13 * w);
        }

        // Una nube con forma de corazón: la curva clásica del corazón + bolitas en el borde para que se vea esponjosa
        function rellenarNubeCorazon(w, dy) {
            const k = w / 34;
            const pts = [];
            for (let i = 0; i < 72; i++) {
                const t = i / 72 * Math.PI * 2;
                pts.push({
                    x: 16 * Math.pow(Math.sin(t), 3) * k,
                    y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * k + dy
                });
            }
            ctx.beginPath();
            pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
            ctx.closePath();
            ctx.fill();
        }

        // Cada nube se dibuja UNA vez en un lienzo pequeño y luego solo se mueve ese dibujo
        function dibujarNube(n) {
            if (!n.sprite) {
                n.sw = Math.ceil(n.w * 1.5); n.sh = Math.ceil(n.w * 1.4); n.sx = n.sw / 2; n.sy = n.w * 0.72;
                const c = document.createElement('canvas');
                c.width = Math.round(n.sw * dpr); c.height = Math.round(n.sh * dpr);
                const prev = ctx; ctx = c.getContext('2d');
                ctx.setTransform(dpr, 0, 0, dpr, n.sx * dpr, n.sy * dpr);
                pintarNube(n);
                ctx = prev; n.sprite = c;
            }
            ctx.drawImage(n.sprite, n.x - n.sx, n.y - n.sy, n.sw, n.sh);
        }
        function pintarNube(n) {
            const w = n.w;
            ctx.save();
            if (n.tipo === 'corazon') {
                ctx.fillStyle = 'rgba(255, 190, 215, 0.55)';           // sombrita rosa de abajo
                rellenarNubeCorazon(w, w * 0.035);
                const g = ctx.createLinearGradient(0, -w * 0.4, 0, w * 0.4);
                g.addColorStop(0, '#ffffff');
                g.addColorStop(1, '#ffe6ef');
                ctx.fillStyle = g;
                rellenarNubeCorazon(w, 0);
            } else {
                ctx.fillStyle = 'rgba(150, 185, 225, 0.55)';           // sombrita azulada de abajo
                rutaNube(n, w * 0.035);
                ctx.fill();
                const g = ctx.createLinearGradient(0, -w * 0.3, 0, w * 0.1);
                g.addColorStop(0, '#ffffff');
                g.addColorStop(1, '#eaf4ff');
                ctx.fillStyle = g;
                rutaNube(n, 0);
                ctx.fill();
            }
            ctx.restore();
        }

        // =====================================================
        //  DIBUJO: COLINAS, ÁRBOL Y LA PERSONA RECOSTADA
        // =====================================================
        const imgRecostado = new Image();
        let imgRecostadoOk = false;
        imgRecostado.onload = function() { imgRecostadoOk = true; if (typeof construirCaches === 'function' && W) construirCaches(); };  // (se redibuja la capa fija cuando llega la imagen)
        imgRecostado.src = IMAGEN_RECOSTADO;

        function dibujarColina(capa, c1, c2) {
            const top = colina(W / 2, capa) - H * 0.05;
            const g = ctx.createLinearGradient(0, top, 0, H);
            g.addColorStop(0, c1);
            g.addColorStop(1, c2);
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(0, H);
            for (let x = 0; x <= W + 6; x += 6) ctx.lineTo(x, colina(Math.min(x, W), capa));
            ctx.lineTo(W, H);
            ctx.closePath();
            ctx.fill();
            // borde iluminado por el sol
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = 0; x <= W + 6; x += 6) {
                const y = colina(Math.min(x, W), capa);
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        // Quien descansa al pie del árbol: una silueta sencilla (o tu imagen recostado.png)
        function dibujarRecostado(x, y, u, t) {
            ctx.save();
            ctx.fillStyle = 'rgba(40, 110, 50, 0.25)';                   // sombra en el pasto
            ctx.beginPath(); ctx.ellipse(x - 0.9 * u, y, 2.4 * u, 0.32 * u, 0, 0, Math.PI * 2); ctx.fill();
            if (imgRecostadoOk) {
                const alto = u * 3.2, ancho = alto * imgRecostado.naturalWidth / imgRecostado.naturalHeight;
                ctx.drawImage(imgRecostado, x - ancho * 0.7, y - alto, ancho, alto);
            } else {
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#5b7fbf'; ctx.lineWidth = 0.42 * u;   // piernas estiradas
                ctx.beginPath(); ctx.moveTo(x - 0.1 * u, y - 0.28 * u); ctx.lineTo(x - 1.9 * u, y - 0.22 * u); ctx.stroke();
                ctx.strokeStyle = '#8a5a3c'; ctx.lineWidth = 0.34 * u;   // zapatos
                ctx.beginPath(); ctx.moveTo(x - 2.0 * u, y - 0.22 * u); ctx.lineTo(x - 2.3 * u, y - 0.22 * u); ctx.stroke();
                ctx.strokeStyle = '#ff8fb1'; ctx.lineWidth = 0.62 * u;   // cuerpo recargado en el tronco
                ctx.beginPath(); ctx.moveTo(x - 0.05 * u, y - 0.4 * u); ctx.lineTo(x + 0.35 * u, y - 1.45 * u); ctx.stroke();
                ctx.fillStyle = '#f2c9a0';                               // cabeza
                ctx.beginPath(); ctx.arc(x + 0.5 * u, y - 1.95 * u, 0.38 * u, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#4a3126';                               // cabello
                ctx.beginPath(); ctx.arc(x + 0.5 * u, y - 2.0 * u, 0.4 * u, Math.PI, Math.PI * 1.95); ctx.fill();
            }
            ctx.restore();
        }
        // un corazoncito que late sobre su cabeza (está soñando): es lo único que se mueve de esa parte
        function dibujarSueno(t) {
            const th = arbolAlto, x = arbolX - th * 0.08, y = arbolBase + 1, u = th * 0.075;
            ctx.fillStyle = '#ff4f7e';
            corazon(x + 0.5 * u, y - 3.1 * u - Math.sin(t * 1.6) * 0.15 * u, 0.32 * u * (1 + 0.1 * Math.sin(t * 3.1)));
        }

        function dibujarArbol(t) {
            const th = arbolAlto, x = arbolX, y = arbolBase;
            ctx.fillStyle = 'rgba(40, 110, 50, 0.25)';                   // sombra del árbol
            ctx.beginPath(); ctx.ellipse(x, y + 2, th * 0.38, th * 0.05, 0, 0, Math.PI * 2); ctx.fill();

            // tronco
            ctx.fillStyle = '#7b4f2e';
            ctx.beginPath();
            ctx.moveTo(x - th * 0.04, y); ctx.lineTo(x - th * 0.022, y - th * 0.46);
            ctx.lineTo(x + th * 0.022, y - th * 0.46); ctx.lineTo(x + th * 0.04, y);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#5e3b20';                                   // lado en sombra
            ctx.beginPath();
            ctx.moveTo(x + th * 0.008, y); ctx.lineTo(x + th * 0.008, y - th * 0.46);
            ctx.lineTo(x + th * 0.022, y - th * 0.46); ctx.lineTo(x + th * 0.04, y);
            ctx.closePath(); ctx.fill();

            dibujarRecostado(x - th * 0.05 - th * 0.03, y + 1, th * 0.075, t);

            // copa: tres capas de bolitas verdes (oscuro, medio y claro)
            const cx = x, cy = y - th * 0.64;
            const bolas = [[0, 0, 0.30], [-0.2, 0.06, 0.22], [0.2, 0.06, 0.22], [-0.1, -0.17, 0.2],
                           [0.12, -0.16, 0.2], [-0.3, 0.15, 0.14], [0.3, 0.15, 0.14]];
            [['#3e9448', 1, 0, 0], ['#58b857', 0.85, -0.03, -0.03], ['#80d56f', 0.5, -0.08, -0.08]].forEach(function(c) {
                ctx.fillStyle = c[0];
                ctx.beginPath();
                bolas.forEach(function(b) {
                    const r = b[2] * th * c[1];
                    const px = cx + (b[0] + c[2]) * th, py = cy + (b[1] + c[3]) * th;
                    ctx.moveTo(px + r, py); ctx.arc(px, py, r, 0, Math.PI * 2);
                });
                ctx.fill();
            });
            // florecitas rosas en la copa
            ctx.fillStyle = '#ffb3c8';
            [[-0.18, -0.12], [0.16, -0.05], [0.02, 0.1], [-0.28, 0.08], [0.27, 0.12], [0.0, -0.24]].forEach(function(p) {
                ctx.beginPath(); ctx.arc(cx + p[0] * th, cy + p[1] * th, th * 0.018, 0, Math.PI * 2); ctx.fill();
            });
        }

        // =====================================================
        //  DIBUJO: FLORES Y PASTO (mueven con el viento)
        // =====================================================
        function dibujarFlor(f, t) {
            const sway = Math.sin(t * 1.3 + f.fase + f.x * 0.004) * f.alto * 0.06;
            const cx = f.x + sway, cy = f.y - f.alto;
            ctx.strokeStyle = '#3f9b46';
            ctx.lineWidth = Math.max(1, 1.6 * f.esc);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(f.x, f.y);
            ctx.quadraticCurveTo(f.x + sway * 0.2, f.y - f.alto * 0.5, cx, cy);
            ctx.stroke();
            ctx.fillStyle = '#4aa84f';                                   // hojita
            ctx.beginPath();
            ctx.ellipse(f.x + f.pr * 0.7, f.y - f.alto * 0.4, f.pr * 0.8, f.pr * 0.35, -0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = f.col.petalo;                                // pétalos
            for (let i = 0; i < f.n; i++) {
                const ang = i / f.n * Math.PI * 2 + f.fase;
                ctx.beginPath();
                ctx.arc(cx + Math.cos(ang) * f.pr * 1.05, cy + Math.sin(ang) * f.pr * 1.0, f.pr, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = f.col.centro;                                // centro
            ctx.beginPath(); ctx.arc(cx, cy, f.pr * 0.62, 0, Math.PI * 2); ctx.fill();
        }

        const VERDES = ['#4aa04a', '#5fb85a', '#7bcf6b'];
        function dibujarPasto(p, t) {
            ctx.lineCap = 'round';
            ctx.lineWidth = Math.max(1, 1.5 * p.esc);
            for (let k = 0; k < p.n; k++) {
                const ox = (k - (p.n - 1) / 2) * 3.2 * p.esc;
                const alto = (14 + (k * 7919 % 5) * 2.2) * p.esc;
                const lean = (k - (p.n - 1) / 2) * 3 * p.esc + Math.sin(t * 1.4 + p.fase + p.x * 0.01 + k) * 2.2 * p.esc;
                ctx.strokeStyle = VERDES[k % 3];
                ctx.beginPath();
                ctx.moveTo(p.x + ox, p.y);
                ctx.quadraticCurveTo(p.x + ox + lean * 0.3, p.y - alto * 0.6, p.x + ox + lean, p.y - alto);
                ctx.stroke();
            }
        }

        // =====================================================
        //  EL CORAZÓN ESCONDIDO
        // =====================================================
        let chispas = [];       // corazoncitos que suben del corazón escondido
        let proxChispa = 1;

        function dibujarCorazonEscondido(s, t) {
            const pulso = 0.5 + 0.5 * Math.sin(t * 2.2);

            // resplandor suave que respira
            const rg = s * 4.4 * (0.9 + 0.2 * pulso);
            const g = ctx.createRadialGradient(hx, hy, s * 0.2, hx, hy, rg);
            g.addColorStop(0, 'rgba(255, 110, 165, ' + (0.55 * (0.6 + 0.4 * pulso)) + ')');
            g.addColorStop(0.5, 'rgba(255, 150, 195, ' + (0.2 * (0.6 + 0.4 * pulso)) + ')');
            g.addColorStop(1, 'rgba(255, 170, 210, 0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(hx, hy, rg, 0, Math.PI * 2); ctx.fill();

            // un aro que se expande, como una ondita llamando la atención
            const u = (t % 2.6) / 2.6;
            ctx.strokeStyle = 'rgba(255, 110, 165, ' + (0.4 * (1 - u)) + ')';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(hx, hy, s * (1.2 + 2.8 * u), 0, Math.PI * 2); ctx.stroke();

            // el corazón
            ctx.save();
            ctx.shadowColor = 'rgba(255, 70, 130, 0.7)';
            ctx.shadowBlur = s * 0.8;
            const gc = ctx.createRadialGradient(hx - s * 0.35, hy - s * 0.45, s * 0.05, hx, hy, s * 1.25);
            gc.addColorStop(0, '#ffa6c0'); gc.addColorStop(0.45, '#ff5c86'); gc.addColorStop(1, '#e8416f');
            ctx.fillStyle = gc;
            corazon(hx, hy, s);
            ctx.restore();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';                  // brillito
            ctx.save(); ctx.translate(hx - 0.5 * s, hy - 0.38 * s); ctx.rotate(-0.55);
            ctx.beginPath(); ctx.ellipse(0, 0, 0.24 * s, 0.1 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

            // chispitas que titilan alrededor
            for (let j = 0; j < 6; j++) {
                const ang = j * 1.05 + t * 0.4 * (j % 2 ? 1 : -1);
                const d = s * (1.7 + 0.4 * Math.sin(t * 1.1 + j * 1.7));
                const tw = 0.5 + 0.5 * Math.sin(t * 3 + j * 2.3);
                ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.9 * tw) + ')';
                estrellita(hx + Math.cos(ang) * d, hy + Math.sin(ang) * d * 0.8, s * (0.05 + 0.05 * tw));
            }
        }

        function actualizarChispas(dt) {
            proxChispa -= dt;
            if (proxChispa <= 0 && ((estado === 'escena' && descubierto) || estado === 'final')) {
                const fin = estado === 'final';
                chispas.push({ x: fin ? W * (0.12 + 0.76 * Math.random()) : hx + (Math.random() - 0.5) * sH,
                               y: fin ? H * 0.5 : hy - sH * 0.6, t: 0, vida: 1.8 + Math.random() * (fin ? 1.8 : 1),
                               fase: Math.random() * 6, s: sH * (0.12 + Math.random() * 0.1) });
                proxChispa = estado === 'final' ? 0.35 + Math.random() * 0.5 : 0.9 + Math.random() * 1.2;
            }
            for (const c of chispas) { c.t += dt; c.y -= sH * 1.6 * dt; }
            chispas = chispas.filter(c => c.t < c.vida);
        }
        function dibujarChispas() {
            for (const c of chispas) {
                const u = c.t / c.vida;
                ctx.globalAlpha = Math.sin(Math.PI * u) * 0.9;
                ctx.fillStyle = '#ff6b9a';
                corazon(c.x + Math.sin(c.fase + c.t * 3) * sH * 0.4, c.y, c.s);
            }
            ctx.globalAlpha = 1;
        }

        // El corazón grande de la invitación: con brillo de globo, como las tarjetas de la animación
        function dibujarCorazonGrande(x, y, s) {
            ctx.save();
            if (s < sGrande * 1.4) { ctx.shadowColor = 'rgba(255, 70, 130, 0.65)'; ctx.shadowBlur = s * 0.3; }
            const g = ctx.createRadialGradient(x - 0.35 * s, y - 0.45 * s, 0.05 * s, x, y, 1.25 * s);
            g.addColorStop(0, '#ffa6c0'); g.addColorStop(0.45, '#ff5c86'); g.addColorStop(1, '#e8416f');
            ctx.fillStyle = g;
            corazon(x, y, s);
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.30)';
            ctx.translate(x - 0.5 * s, y - 0.4 * s); ctx.rotate(-0.55);
            ctx.beginPath(); ctx.ellipse(0, 0, 0.26 * s, 0.12 * s, 0, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.lineWidth = Math.max(2, s * 0.012);
            trazoCorazon(x, y, s);
            ctx.stroke();
        }

        // =====================================================
        //  ESTADOS:  escena -> creciendo -> invitacion -> entrando
        // =====================================================
        let estado = 'escena';
        let tEstado = 0;
        let hover = false, hoverK = 0, pistaK = 1;
        let corazonActual = { x: 0, y: 0, s: 0 };
        let navegando = false;

        function cambiar(nuevo) { estado = nuevo; tEstado = 0; }

        function colocarInvitacion() {
            const s = sGrande;
            preguntaEl.style.left = (cenX - 0.58 * s) + 'px';
            preguntaEl.style.top = (cenY - 0.34 * s) + 'px';
            preguntaEl.style.width = (1.16 * s) + 'px';
            preguntaEl.style.height = (0.58 * s) + 'px';
            // si el texto no cabe en el corazón, se achica la letra hasta que quepa
            let tam = s * 0.16;
            preguntaEl.style.fontSize = tam + 'px';
            let seguro = 0;
            while (preguntaTxt.offsetHeight > preguntaEl.clientHeight && tam > 12 && seguro++ < 60) {
                tam -= 1;
                preguntaEl.style.fontSize = tam + 'px';
            }
            btnOk.style.left = cenX + 'px';
            btnOk.style.top = (cenY + 0.55 * s) + 'px';
            btnOk.style.fontSize = (s * 0.14) + 'px';
        }

        btnOk.addEventListener('click', function() {
            if (estado !== 'invitacion') return;
            invitacion.classList.remove('visible');
            cambiar('entrando');
        });

        canvas.addEventListener('pointerdown', function(ev) {
            ultPunto = null;
            barrer(ev.clientX, ev.clientY);
            if (estado === 'escena' && descubierto && Math.hypot(ev.clientX - hx, ev.clientY - hy) < Math.max(sH * 2.2, 34)) {
                cambiar('creciendo');
            }
        });
        window.addEventListener('pointerup', function() { ultPunto = null; });
        window.addEventListener('pointermove', function(ev) {
            if (estado === 'escena' && !esperando) barrer(ev.clientX, ev.clientY);
            hover = estado === 'escena' && descubierto && Math.hypot(ev.clientX - hx, ev.clientY - hy) < Math.max(sH * 2.2, 34);
            canvas.style.cursor = hover ? 'pointer' : 'default';
        });

        // =====================================================
        //  BUCLE PRINCIPAL
        // =====================================================
        let ultimo = 0;
        // Botón de corazón al final del mensaje: vuelve a empezar desde la bienvenida
        const btnReiniciar = document.createElement('button');
        btnReiniciar.id = 'btnReiniciar';
        btnReiniciar.type = 'button';
        btnReiniciar.innerHTML = '<svg viewBox="0 0 200 180"><path d="M100 172 C20 112 4 70 4 48 C4 22 24 6 48 6 C72 6 90 20 100 40 C110 20 128 6 152 6 C176 6 196 22 196 48 C196 70 180 112 100 172 Z" fill="#ff5c86" stroke="#fff" stroke-width="5"/></svg><span>Empezar de nuevo</span>';
        btnReiniciar.addEventListener('click', function() {
            if (btnReiniciar.disabled) return;
            btnReiniciar.disabled = true;
            const SEG = 1.8;                                     // ← duración de la despedida (segundos)
            if (window.musica && window.musica.apagar) window.musica.apagar(SEG);   // la canción baja poco a poco
            cortina.style.transition = 'opacity ' + SEG + 's ease';
            cortina.style.opacity = '1';                         // la pantalla se va a rosa suavemente
            setTimeout(function() { window.location.reload(); }, SEG * 1000 + 150);
        });
        mensajeEl.appendChild(btnReiniciar);

        // Fin de la bienvenida: se quita la capa y la cortina rosa se desvanece, descubriendo la animación
        let terminado = false;
        function terminar() {
            terminado = true;
            bienvenida.style.display = 'none';
            window.pausaPrincipal = false;                  // la animación principal vuelve a dibujar
            if (window.musica) window.musica.escena('juego');
            cortina.style.transition = 'opacity 1.3s ease';
            cortina.style.opacity = '0';
                    }

        let tAbierto = 0;
        let esperando = true;       // mientras la puerta la tapa, no se dibuja (la puerta se crea más abajo en la página)
        document.addEventListener('DOMContentLoaded', function() { if (!document.getElementById('puerta')) esperando = false; });
        window.addEventListener('puerta-abierta', function() { esperando = false; tAbierto = performance.now() / 1000; });

        function frame(now) {
            if (terminado) return;
            if (esperando) { ultimo = now; requestAnimationFrame(frame); return; }
            const dt = Math.min((now - ultimo) / 1000, 0.05);
            ultimo = now;
            const t = now / 1000;
            tEstado += dt;

            // 1. cielo y sol (copiados), y las nubes encima (quedan detrás de las colinas)
            ctx.drawImage(cCielo, 0, 0, W, H);
            actualizarNubes(dt);
            nubes.forEach(dibujarNube);

            // 2. colinas y árbol lejano (copiados) + el corazoncito que sueña
            ctx.drawImage(cColinas, 0, 0, W, H);
            dibujarSueno(t);

            // 3. flores y pasto con viento. El corazón escondido va en medio:
            //    lo de más adelante lo tapa un poquito.
            hoverK += ((hover ? 1 : 0) - hoverK) * Math.min(1, dt * 10);
            actualizarAgitacion(dt);
            revK += ((descubierto ? 1 : clamp(progresoBarrido / PROGRESO_PARA_ENCONTRAR) * 0.7) - revK) * Math.min(1, dt * 6);
            const sPequeno = sH * (1 + 0.12 * hoverK) * (1 + 0.04 * Math.sin(t * 3.1)) * revK;   // va saliendo conforme barres
            if (estado === 'escena' && bR) dibujarCapaAgitada(cAtras, t, 0.8); else dibujarCampo(cAtras, t);
            if (estado === 'escena' && revK > 0.03) dibujarCorazonEscondido(sPequeno, t);
            if (estado === 'escena' && bR) dibujarCapaAgitada(cFrente, t, 1.2); else dibujarCampo(cFrente, t);

            actualizarChispas(dt);
            dibujarChispas();

            // 4. la pista, para que se note que hay algo escondido
            pistaK += ((estado === 'escena' ? 1 : 0) - pistaK) * Math.min(1, dt * 4);
            if (PISTA && pistaK > 0.01) {
                const a = clamp((t - tAbierto - 7) / 1.5) * (0.75 + 0.25 * Math.sin(t * 2)) * pistaK;
                if (a > 0.01) {
                    const tam = clamp(W * 0.035, 20, 34);
                    ctx.font = '700 ' + tam + 'px ' + FUENTE;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.globalAlpha = a;
                    ctx.shadowColor = 'rgba(30, 90, 40, 0.6)';
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(descubierto ? PISTA_TOCAR : PISTA, W / 2, Math.min(H * 0.95, hy + sH * 3.6));
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }
            }

            // 5. el corazón crece, se vuelve la invitación y, con OK, se llena la pantalla
            if (estado !== 'escena' && estado !== 'final') {
                let velo = 0, c = corazonActual;
                if (estado === 'creciendo') {
                    const p = clamp(tEstado / 1.5), pe = easeInOut(p);
                    c.x = lerp(hx, cenX, pe); c.y = lerp(hy, cenY, pe);
                    c.s = lerp(sH, sGrande, easeOutBack(clamp(p / 0.85)));
                    velo = 0.55 * pe;
                    if (p >= 1) {
                        cambiar('invitacion');
                        colocarInvitacion();
                        invitacion.classList.add('visible');
                        setTimeout(function() { btnOk.focus({ preventScroll: true }); }, 700);
                    }
                } else if (estado === 'invitacion') {
                    c.x = cenX; c.y = cenY;
                    c.s = sGrande * (1 + 0.025 * Math.sin(t * 3));     // late despacito
                    velo = 0.55;
                } else {   // entrando
                    const p = clamp(tEstado / 1.1);
                    c.x = cenX; c.y = cenY;
                    c.s = lerp(sGrande, Math.hypot(W, H) * 0.9, p * p * p);
                    velo = 0.55;
                    if (tEstado > 0.75) cortina.style.opacity = '1';
                    if (tEstado > 1.4 && !navegando) { navegando = true; terminar(); }
                }
                ctx.fillStyle = 'rgba(255, 238, 246, ' + velo + ')';
                ctx.fillRect(0, 0, W, H);
                dibujarCorazonGrande(c.x, c.y, c.s);
            }

            // 6. final: el mensaje se desplaza solito; si lo tocas o lo mueves, se detiene unos segundos
            if (estado === 'final' && tEstado > 3) {
                if (pausaMsg > 0) { pausaMsg -= dt; posMsg = mensajeEl.scrollTop; }
                else { posMsg += VEL_MENSAJE * dt; mensajeEl.scrollTop = posMsg; }
            }

            requestAnimationFrame(frame);
        }

        let pausaMsg = 0, posMsg = 0;
        ['wheel', 'touchstart', 'pointerdown', 'keydown'].forEach(function(n) {
            mensajeEl.addEventListener(n, function() { pausaMsg = 4; }, { passive: true });
        });

        // Se llama desde la animación cuando se toca a Snoopy y Fifi: cortina rosa -> cielo con el mensaje
        window.iniciarFinal = function() {
            cortina.style.transition = 'opacity 0.9s ease';
            cortina.style.opacity = '1';
            if (window.musica) window.musica.escena('final');
            setTimeout(function() {
                medir(); crearEscena(); crearNubes();
                chispas = []; pausaMsg = 0; posMsg = 0; mensajeEl.scrollTop = 0;
                invitacion.classList.remove('visible');
                bienvenida.style.display = 'block';
                window.pausaPrincipal = true;
                cambiar('final');
                terminado = false;
                ultimo = performance.now();
                requestAnimationFrame(frame);
                setTimeout(function() {
                    cortina.style.transition = 'opacity 1.3s ease';
                    cortina.style.opacity = '0';
                    finalEl.classList.add('visible');
                }, 150);
            }, 1000);
        };

        medir();
        crearEscena();
        crearNubes();
        construirCaches();
        window.addEventListener('resize', function() {
            if (terminado) return;
            medir();
            crearEscena();
            crearNubes();
            construirCaches();
            if (estado === 'invitacion') colocarInvitacion();
        });
        requestAnimationFrame(frame);
    })();
    </script>

    <!-- PUERTA: la contraseña. Va encima de todo y se abre al poner la clave correcta -->
    <div id="puerta">
        <div id="puertaFondo"></div>
        <div id="puertaCaja">
            <img id="puertaImg" src="contrasena.jpg" alt="" draggable="false">

            <div id="campoClave" class="el">
                <svg class="candado" viewBox="0 0 34 40"><path d="M9 17V11a8 8 0 0 1 16 0v6" fill="none" stroke="#8b6358" stroke-width="4.5" stroke-linecap="round"/><rect x="2" y="16" width="30" height="22" rx="6" fill="#8b6358"/><circle cx="17" cy="26" r="3.2" fill="#fff8ee"/><rect x="15.6" y="27" width="2.8" height="6" rx="1.2" fill="#fff8ee"/></svg>
                <input id="clave" type="password" placeholder="Contraseña..." autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
                <button id="ojo" type="button" aria-label="Mostrar u ocultar la contraseña">
                    <svg id="ojoIcono" viewBox="0 0 40 40"><path d="M3 20c4-7 10-11 17-11s13 4 17 11c-4 7-10 11-17 11S7 27 3 20z" fill="none" stroke="#c9a396" stroke-width="3" stroke-linejoin="round"/><circle cx="20" cy="20" r="5.5" fill="#c9a396"/><path id="ojoTacha" d="M6 34L34 6" stroke="#c9a396" stroke-width="3.2" stroke-linecap="round"/></svg>
                </button>
            </div>

            <button id="btnEntrar" class="el" type="button">Entrar ♥</button>
            <div id="puertaMsg" class="el" aria-live="polite"></div>
            <div id="burbuja" class="el pop"></div>
        </div>

    </div>
    <script>
    (function() {
        const puerta = document.getElementById('puerta');
        const caja = document.getElementById('puertaCaja');
        const campo = document.getElementById('campoClave');
        const clave = document.getElementById('clave');
        const ojo = document.getElementById('ojo');
        const ojoTacha = document.getElementById('ojoTacha');
        const btn = document.getElementById('btnEntrar');
        const msg = document.getElementById('puertaMsg');
        const burbuja = document.getElementById('burbuja');
        const avionHola = document.getElementById('holaAvion');

        // =====================================================
        //  AJUSTES de la puerta
        // =====================================================
        // Las contraseñas válidas NO se escriben en claro: se guarda su "huella" (hash).
        // Para cambiarla: abre la página, pulsa F12, en la consola escribe  generarHash('tu clave')  y pega el número aquí.
        // La clave actual es:  06112026  (da igual si pone espacios o diagonales, por ejemplo 06/11/2026)
        const HASHES = [1644029301786623];
        const PISTA = 'Es nuestra fecha especial: día, mes y año ♥';
        const INTENTOS_ANTES_DE_PAUSA = 5;     // cuántos errores seguidos antes de esperar un ratito
        const SEGUNDOS_DE_PAUSA = 30;
        const FRASES = {
            inicio: '¡Hola, mi amor! 👋 Escribe la contraseña para entrar 💕',
            foco: 'Es algo muy especial para nosotros… 🥰',
            error: '¡Uy! Esa no es 🥺 Inténtalo otra vez',
            casi: '¡Casi! 🤏 ¿Quieres una pista?',
            pausa: 'Descansemos un ratito… 🌸',
            exito: '¡Bienvenida, mi amor! 💖'
        };
        const R = 992 / 1064;                   // proporción de la imagen (ancho / alto)

        // =====================================================
        //  La clave: se normaliza (sin mayúsculas, acentos ni espacios) y se convierte en huella
        // =====================================================
        function hash(str, seed) {
            seed = seed || 0;
            let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
            for (let i = 0, ch; i < str.length; i++) {
                ch = str.charCodeAt(i);
                h1 = Math.imul(h1 ^ ch, 2654435761);
                h2 = Math.imul(h2 ^ ch, 1597334677);
            }
            h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
            h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
            return 4294967296 * (2097151 & h2) + (h1 >>> 0);
        }
        function normalizar(t) {
            return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9ñ]/g, '');
        }
        window.generarHash = function(t) { const h = hash(normalizar(t)); console.log(h); return h; };

        // =====================================================
        //  Tamaño: la imagen se ajusta a la pantalla y todo lo demás se mide en "u" (1 u = 1 px de la imagen)
        // =====================================================
        function acomodar() {
            const vw = window.innerWidth, vh = window.innerHeight;
            let w = Math.min(vh * R, vw);
            if (vw < vh * 0.8) w = Math.min(vw * 1.25, vh * R);      // en celular se ve un poco más grande (se recortan los lados)
            const h = w / R;
            caja.style.width = w + 'px'; caja.style.height = h + 'px';
            caja.style.left = (vw - w) / 2 + 'px'; caja.style.top = (vh - h) / 2 + 'px';
            caja.style.setProperty('--u', (w / 992) + 'px');
            // la avioneta que saluda: su tamaño depende de la pantalla
            const pw = Math.max(110, Math.min(vw * 0.2, 210)), ph = pw * 479 / 650;
            const cw = Math.max(130, pw * 1.05), ch = Math.max(30, ph * 0.3), cuerda = Math.max(26, pw * 0.2);
            const ty = ph * 0.653;
            [avionHola].forEach(function(av) {
            const bob = av.firstElementChild;
            bob.style.width = (cw + cuerda + pw) + 'px'; bob.style.height = ph + 'px';
            const cartel = bob.querySelector('.cartel'), cu = bob.querySelector('.cuerda'), img = bob.querySelector('img');
            cartel.style.width = cw + 'px'; cartel.style.height = ch + 'px'; cartel.style.top = (ty - ch / 2) + 'px';
            cartel.style.fontSize = ch * 0.62 + 'px';
            cu.style.left = (cw * 0.9) + 'px'; cu.style.width = (cuerda + pw * 0.03 + cw * 0.1) + 'px'; cu.style.top = ty + 'px';
            img.style.left = (cw + cuerda) + 'px'; img.style.top = 0; img.style.width = pw + 'px';
            });
        }
        avionHola.querySelector('.cartel').textContent = '¡Hola, amor! ♥';      // ← lo que dice la avioneta al entrar
        avionHola.addEventListener('animationend', function() { avionHola.remove(); });   // pasa una vez y desaparece
        window.addEventListener('puerta-abierta', function() { setTimeout(function() { avionHola.classList.add('vuela'); }, 900); });
        window.addEventListener('resize', acomodar);
        acomodar();

        // =====================================================
        //  El globo de Snoopy
        // =====================================================
        function decir(texto) {
            burbuja.textContent = texto;
            burbuja.classList.remove('pop'); void burbuja.offsetWidth; burbuja.classList.add('pop');
        }
        function avisar(html, esHtml) {
            if (esHtml) msg.innerHTML = html; else msg.textContent = html;
            msg.classList.toggle('visible', !!html);
        }
        decir(FRASES.inicio);

        // =====================================================
        //  Comprobar la clave
        // =====================================================
        let errores = 0, bloqueado = false, abierta = false;

        function mostrarPista() { avisar('Pista: ' + PISTA); decir('💡 ' + PISTA); }

        function fallar() {
            errores++;
            campo.classList.remove('error'); void campo.offsetWidth; campo.classList.add('error');
            clave.select();
            if (errores >= INTENTOS_ANTES_DE_PAUSA) { pausar(); return; }
            if (errores >= 2) {
                avisar('Contraseña incorrecta · <button type="button" id="verPista">ver pista</button>', true);
                document.getElementById('verPista').addEventListener('click', mostrarPista);
                decir(FRASES.casi);
            } else {
                avisar('Contraseña incorrecta');
                decir(FRASES.error);
            }
        }

        function pausar() {
            bloqueado = true; clave.disabled = true; btn.disabled = true;
            let s = SEGUNDOS_DE_PAUSA;
            decir(FRASES.pausa);
            const t = setInterval(function() {
                avisar('Demasiados intentos. Espera ' + s + ' s…');
                if (s-- <= 0) {
                    clearInterval(t); bloqueado = false; errores = 0;
                    clave.disabled = false; btn.disabled = false; avisar(''); decir(FRASES.inicio); clave.focus();
                }
            }, 1000);
            avisar('Demasiados intentos. Espera ' + s-- + ' s…');
        }

        function corazonesDeFiesta() {                 // una lluvia de corazones desde el candado del moño
            const ox = caja.offsetWidth * 0.5, oy = caja.offsetHeight * 0.343;
            const colores = ['#ff5c86', '#ff8fb1', '#ffb3c6', '#ffd166', '#c77dff', '#ff6b6b'];
            for (let i = 0; i < 34; i++) {
                const e = document.createElement('div');
                e.className = 'corazonSalta'; e.textContent = '♥';
                e.style.left = ox + 'px'; e.style.top = oy + 'px';
                e.style.color = colores[i % colores.length];
                e.style.fontSize = (16 + Math.random() * 26) + 'px';
                caja.appendChild(e);
                const ang = Math.random() * Math.PI * 2, d = 90 + Math.random() * 260;
                e.animate([
                    { transform: 'translate(-50%, -50%) scale(0.3)', opacity: 1 },
                    { transform: 'translate(calc(-50% + ' + Math.cos(ang) * d + 'px), calc(-50% + ' + (Math.sin(ang) * d - 60) + 'px)) scale(1.1)', opacity: 1, offset: 0.6 },
                    { transform: 'translate(calc(-50% + ' + Math.cos(ang) * d * 1.1 + 'px), calc(-50% + ' + (Math.sin(ang) * d + 40) + 'px)) scale(0.8)', opacity: 0 }
                ], { duration: 1400 + Math.random() * 900, easing: 'ease-out', fill: 'forwards' }).onfinish = function() { e.remove(); };
            }
        }

        function abrir() {
            abierta = true;
            clave.disabled = true; btn.disabled = true;
            avisar('¡Correcta! 💖');
            decir(FRASES.exito);
            corazonesDeFiesta();
            setTimeout(function() {
                window.dispatchEvent(new Event('puerta-abierta'));      // despierta la bienvenida
                puerta.classList.add('saliendo');
            }, 1300);
            setTimeout(function() { puerta.remove(); }, 2700);
        }

        function comprobar() {
            if (bloqueado || abierta) return;
            const t = normalizar(clave.value);
            if (!t) { campo.classList.remove('error'); void campo.offsetWidth; campo.classList.add('error'); clave.focus(); return; }
            if (HASHES.indexOf(hash(t)) !== -1) abrir(); else fallar();
        }

        btn.addEventListener('click', comprobar);
        clave.addEventListener('keydown', function(ev) {
            if (ev.key === 'Enter') comprobar();
            if (ev.getModifierState && ev.getModifierState('CapsLock') && !msg.classList.contains('visible')) avisar('Ojo: tienes el Bloq Mayús activado');
        });
        clave.addEventListener('input', function() { if (msg.textContent.indexOf('Bloq') !== -1) avisar(''); });
        clave.addEventListener('focus', function() { if (errores === 0 && !abierta) decir(FRASES.foco); });

        // el ojito: mostrar u ocultar lo que se escribe
        function pintarOjo() { ojoTacha.style.display = clave.type === 'password' ? 'block' : 'none'; }
        ojo.addEventListener('click', function() { clave.type = clave.type === 'password' ? 'text' : 'password'; pintarOjo(); clave.focus(); });
        pintarOjo();

        setTimeout(function() { try { clave.focus({ preventScroll: true }); } catch (e) {} }, 900);
    })();
    </script>

    <button id="btnMusica" type="button" aria-label="Activar o silenciar la música">🔊</button>
    <script>
    // =====================================================
    //  MÚSICA: una canción por escena, con fundido suave entre ellas
    // =====================================================
    (function() {
        // ---------- AJUSTES ----------
        // Pon tus canciones dentro de una carpeta llamada "musica", junto a este archivo.
        // archivo: el nombre del mp3 · volumen: de 0 a 1 · inicio: segundo desde el que empieza (opcional)
        // ("A Thousand Years" trae 5.6 segundos de silencio al principio: por eso empieza en el segundo 5.6)
        // Si dos escenas usan el MISMO archivo, la canción sigue sonando sin reiniciarse.
        // Deja  null  en una escena para que ahí no suene nada (se apaga con fundido).
        const MUSICA = {
            puerta:     { archivo: 'musica/alegre.mp3',   volumen: 0.45 },   // 1ª canción (alegre, "Here Comes the Sun"): la contraseña
            bienvenida: { archivo: 'musica/alegre.mp3',   volumen: 0.5 },    //   ...el campo con el corazón escondido
            juego:      { archivo: 'musica/alegre.mp3',   volumen: 0.5 },    //   ...y el arco y la flecha (sigue sin cortarse)
            teamo:      { archivo: 'musica/thousand_years.mp3', volumen: 0.55, inicio: 5.6 },   // 2ª canción ("A Thousand Years"): entra con el flechazo y el "Te amo"
            arbol:      { archivo: 'musica/thousand_years.mp3', volumen: 0.55, inicio: 5.6 },   //   ...el árbol y las tarjetas
            final:      { archivo: 'musica/thousand_years.mp3', volumen: 0.3, inicio: 5.6 }     //   ...el mensaje (más bajito para poder leer). Para una 3ª canción: cambia este archivo
        };
        const FUNDIDO = 2;              // segundos que tarda el cambio de canción

        const boton = document.getElementById('btnMusica');
        const precargadas = {};
        let desbloqueado = false, escenaPendiente = 'puerta', escenaActual = '', actual = null, silenciado = false;
        try { silenciado = localStorage.getItem('musicaSilenciada') === '1'; } catch (e) {}

        function pintarBoton() { boton.textContent = silenciado ? '🔇' : '🔊'; }

        // Sube o baja el volumen poco a poco (y al llegar a 0 libera la canción vieja)
        function fundir(a, hasta, quitar, seg) {
            if (a._t) clearInterval(a._t);
            const paso = 50, desde = a.volume, n = Math.max(1, (seg || FUNDIDO) * 1000 / paso);
            let i = 0;
            a._t = setInterval(function() {
                i++;
                const u = i / n;       // cruce "de potencia igual": el que entra sube y el que sale baja sin dejar un hueco
                a.volume = Math.min(1, Math.max(0, hasta > desde ? desde + (hasta - desde) * Math.sin(u * Math.PI / 2) : hasta + (desde - hasta) * Math.cos(u * Math.PI / 2)));
                if (i >= n) { clearInterval(a._t); if (quitar) { a.pause(); a.removeAttribute('src'); a.load(); } }
            }, paso);
        }

        function aplicar(nombre) {
            const cfg = MUSICA[nombre];
            escenaActual = nombre;
            if (!cfg || !cfg.archivo) { if (actual) { fundir(actual, 0, true); actual = null; } return; }
            if (actual && actual._archivo === cfg.archivo) { fundir(actual, cfg.volumen); return; }   // misma canción: solo ajusta el volumen
            const a = new Audio();
            a._archivo = cfg.archivo; a.loop = !cfg.inicio; a.volume = 0; a.muted = silenciado; a.preload = 'auto';
            a.src = cfg.archivo;
            if (cfg.inicio) a.addEventListener('ended', function() { a.currentTime = cfg.inicio; const q = a.play(); if (q && q.catch) q.catch(function() {}); });   // al repetirse, se salta el silencio del principio
            if (cfg.inicio) a.addEventListener('loadedmetadata', function() { try { a.currentTime = cfg.inicio; } catch (e) {} }, { once: true });
            a.addEventListener('error', function() { if (actual === a) actual = null; });     // si falta el archivo, simplemente no suena
            const p = a.play(); if (p && p.catch) p.catch(function() {});
            fundir(a, cfg.volumen);
            if (actual) fundir(actual, 0, true);
            actual = a;
        }

        window.musica = {
            apagar: function(seg) { if (actual) fundir(actual, 0, false, seg); },     // baja el volumen a cero poco a poco
            escena: function(nombre) {
                escenaPendiente = nombre;
                if (desbloqueado && nombre !== escenaActual) aplicar(nombre);
            },
            _estado: function() { return { escena: escenaActual, archivo: actual && actual._archivo, vol: actual && +actual.volume.toFixed(2), silenciado: silenciado, sonando: !!actual && !actual.paused }; }
        };

        // Los navegadores no dejan sonar nada hasta que la persona toca algo: se empieza con el primer toque o tecla
        function desbloquear() {
            if (desbloqueado) return;
            desbloqueado = true;
            ['pointerdown', 'keydown', 'touchstart'].forEach(function(n) { window.removeEventListener(n, desbloquear, true); });
            aplicar(escenaPendiente);
            Object.keys(MUSICA).forEach(function(k) {        // precarga las otras canciones para que el cambio sea instantáneo
                const c = MUSICA[k]; if (!c || !c.archivo || precargadas[c.archivo]) return;
                precargadas[c.archivo] = 1; const x = new Audio(); x.preload = 'auto'; x.src = c.archivo;
            });
        }
        ['pointerdown', 'keydown', 'touchstart'].forEach(function(n) { window.addEventListener(n, desbloquear, true); });

        window.addEventListener('puerta-abierta', function() { window.musica.escena('bienvenida'); });

        boton.addEventListener('click', function() {
            silenciado = !silenciado;
            if (actual) actual.muted = silenciado;
            try { localStorage.setItem('musicaSilenciada', silenciado ? '1' : '0'); } catch (e) {}
            pintarBoton();
        });
        pintarBoton();
        boton.classList.add('visible');

        // al cambiar de pestaña, se pausa; al volver, sigue
        document.addEventListener('visibilitychange', function() {
            if (!actual) return;
            if (document.hidden) actual.pause(); else { const p = actual.play(); if (p && p.catch) p.catch(function() {}); }
        });
    })();
    </script>
